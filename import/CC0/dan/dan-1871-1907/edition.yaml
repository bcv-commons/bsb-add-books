# Synced by sync_from_upstream.py in this folder (no fetch recipe): see README.md for where the two OSIS
# files come from, the pinned commit and their SHA-256. The files themselves (osis/) are
# git-ignored; the script copies them in.
# One edition = one existing translation (a whole Bible, an NT, or single books).

name: "Bibelen, autoriseret oversættelse (GT 1871, NT 1907)"
language: da
role: style
text_dir: osis
format: >-
  two OSIS 2 XML files, DA_OT1871.OSIS.xml and DA_NT1907.OSIS.xml, original orthography; verses as
  <verse osisID="Gen.1.1" sID=…/>…<verse eID=…/>, footnotes as <note>, chapter summaries as
  <title canonical="false">

# The 1907 NT keeps the received-text verses but puts the disputed ones in brackets with a note
# that the oldest manuscripts lack them (Mt 6:13b, 18:11, Acts 8:37, Mk 16:9-20, Jn 8:1-11);
# 1 Jn 5:7 has no Comma. Closest of our bases: majority.
nt_basis: majority

books: [gen, exo, lev, num, deu, jos, jdg, rut, 1sa, 2sa, 1ki, 2ki, 1ch, 2ch, ezr, neh, est, job,
        psa, pro, ecc, sng, isa, jer, lam, ezk, dan, hos, jol, amo, oba, jon, mic, nam, hab, zep,
        hag, zec, mal, mat, mrk, luk, jhn, act, rom, 1co, 2co, gal, eph, php, col, 1th, 2th, 1ti,
        2ti, tit, phm, heb, jas, 1pe, 2pe, 1jn, 2jn, 3jn, jud, rev]
quarantine: []

# How a clone gets the text, which is not in git (scripts/project.py missing_text)
get_text: python3 import/CC0/dan/dan-1871-1907/sync_from_upstream.py   # the pinned commit
source: >-
  Den Frie Bibel's repository, github.com/EzerIT/DFB, tekst/DA_OT1871.OSIS.xml and
  tekst/DA_NT1907.OSIS.xml (the synced commit and the files' SHA-256 are in README.md).
  Scanned, OCR'd and encoded by Ulrik Sandborg-Petersen (github.com/emg), corrected since by
  Den Frie Bibel.
licence: >-
  public domain: "This Old/New Testament is in the Public Domain" (the files' <rights>); the
  repository's LICENSE: "The Danish Bible text in the tekst folder is in the public domain."
attribution: ""

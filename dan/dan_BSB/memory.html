e <a href=\"#gen-1-19.md\">siden om 1 Mos 1-19<\/a>.<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>El Shaddai:<\/strong> »Gud den Almægtige« (projektet, DFB 1 Mos 28,3) eller »El Shadaj« (DFB 1 Mos 17,1)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>ʔădōnāy YHWH<\/em>:<\/strong> »Herre HERRE« eller »Herre, HERRE« i tiltale (DFB 6 / 8), »Herren HERREN« ellers – og hvad med DFB 1 Mos 15,2 »Gud HERREN!«?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Citat i citat:<\/strong> &gt;…&lt; (DFB's &gt;&gt;…&lt;&lt;-filer, 433×) eller ›…‹ (project.yaml, 29× i DFB)? Udkastene blander.<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Apostrof:<\/strong> lige ' (udkastene) eller typografisk ’ (DFB's flertal)? Kan rettes maskinelt.<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>šifḥāh<\/em> / <em>ʔāmāh<\/em>:<\/strong> trælkvinde, tjenestepige (DFB 1 Mos 16) eller slavinde – og skal de to ord skelnes?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>bᵊnê yiśrāʔēl<\/em> i 1 Mos:<\/strong> israelitterne, Israels sønner eller Israels børn (1 Mos 32,33; 42,5; 50,25)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>»samlet til sine fædre« / »til sit folk«<\/strong> (1 Mos 25,8.17; 35,29; 49,29.33)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>ʕēdāh<\/em>:<\/strong> menighed (Josva) eller forsamling (DFB 4 Mos) for hele projektet?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>»Efraims bjergland«<\/strong> (udkastene 14×) eller DFB's »Efraims Bjerge« (Dom 12×)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>»slog ned med sværd«<\/strong> (DFB Dom 1,8) eller »huggede ned med sværd« (Jos 6,21; 11)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>qannāʔ<\/em>:<\/strong> »skinsyg« (DFB 2 Mos 34,14) eller »nidkær«?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>»Lovet være HERREN«<\/strong> eller »Velsignet være HERREN« for <em>bārûk YHWH<\/em>?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>»Her er jeg«<\/strong> eller DFB's »Se, her er jeg« for <em>hinnēnî<\/em>?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Navne:<\/strong> Morija/Moria; Hanok/Enok (Rubens søn); Efrat/Efrata; Mispe/Mispa (Jos 15,38; 18,26); Hermon eller Hermonbjerget; Kinneret(søen) eller Kinnerets Hav; Zins/Sins ørken (Jos 15,1).<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Glossenøgler:<\/strong> skal {N: Sheol} og {N: band} med på listen?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>tôlᵊdôt<\/em>:<\/strong> altid »slægtshistorie«, eller »historien om« ved 2,4-typen?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong><em>ḥæsæd wæʔæmæt<\/em>:<\/strong> »trofasthed og troskab« eller en anden parring?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Daniel:<\/strong> embedstitlerne i 3,2-3 og instrumenterne i 3,5; <em>gāzᵊrîn<\/em> »spåmænd« eller »stjernetydere«; stort M i »menneskesøn« (7,13); »Sydens konge« eller »kongen i Syd«; »Mene, mene, tekel, ufarsin«.<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Ordenstal i datoer:<\/strong> cifre (»den 14. dag«) eller bogstaver (»den fjortende dag«, DFB 2 Mos 12)?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Poesi:<\/strong> skal Daniels drømme (kap. 4), bønnen 9,4-19 og Dan 12,1-3 sættes som poesi, som BSB gør?<\/p>"}, {"page": "spoergsmaal.md", "title": "Spørgsmål til sprogteamet", "html": "<p><strong>Ledere / krigere i Josva:<\/strong> <em>gibbôrê haḥayil<\/em> »krigsdygtige mænd« og <em>ḥălûṣîm<\/em> »bevæbnede«?<\/p>"}], "credits": "<h1>Credits<\/h1>\n<p>Our work in this folder (drafts, notes, the wiki's prose, the language store, statistics) is dedicated to the public domain (CC0 1.0). We learned from and quote the editions below (docs/licensing.md).<\/p>\n<p>Public domain; credited with thanks:<\/p>\n<ul><li>Den Frie Bibel (https://denfriebibel.dk), public domain<\/li><\/ul>"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ᷀-᷿꞉]/g, "").toLowerCase();
let tab = "pages", page = "index.md";
const HELP = `<div class="help">This is a read-only copy, built by <code>python3 scripts/wiki.py view ${esc(DATA.project)}</code>.
To add what you know, edit the page's <code>.md</code> file in <code>wiki/</code>, or send the text to whoever keeps it.
To correct a fact, write under it: <code>&gt; **Correction (your name, date):** …</code>. The next agent turns it into a store entry.
The grey "Store entries" boxes are generated from the store; don't edit them by hand.</div>`;

function side() {
  if (tab !== "pages") { $("#side").innerHTML = sideCounts(); return; }
  const g = {top: [], grammar: [], end: []};
  DATA.pages.forEach(p => (p.id.startsWith("grammar/") ? g.grammar : ["inbox.md", "log.md"].includes(p.id) ? g.end : g.top).push(p));
  const n = id => DATA.store.filter(e => e.live && e.page === id).length;
  const link = p => `<a href="#${p.id}" class="${p.id === page ? "on" : ""}">${esc(p.title)}${n(p.id) ? `<span class="n">${n(p.id)}</span>` : ""}</a>`;
  $("#side").innerHTML = g.top.map(link).join("") + `<div class="grp">Grammar</div>` + g.grammar.map(link).join("")
    + `<div class="grp">Upkeep</div>` + g.end.map(link).join("");
}
function sideCounts() {
  const live = DATA.store.filter(e => e.live), c = {};
  live.forEach(e => c[e.kind] = (c[e.kind] || 0) + 1);
  return `<div class="grp">Store</div>` + Object.entries(c).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<a href="javascript:void(0)" onclick="kindFilter('${k}')">${esc(k)}<span class="n">${v}</span></a>`).join("")
    + `<div class="grp">Totals</div><a>live<span class="n">${live.length}</span></a><a>superseded<span class="n">${DATA.store.length - live.length}</span></a>`;
}
function showPage() {
  const p = DATA.pages.find(p => p.id === page) || DATA.pages[0];
  $("#main").innerHTML = (p.id === "index.md" ? HELP : "") + p.html;
  window.scrollTo(0, 0);
}
function entryHtml(e) {
  const v = typeof e.value === "string" ? e.value : JSON.stringify(e.value);
  const by = DATA.store.filter(x => x.supersedes === e.id).map(x => x.id);
  return `<div class="entry ${e.live ? "" : "dead"}"><div class="top"><span class="tag kind">${esc(e.kind)}</span>
    ${e.source ? `<span>${esc(e.source)} →</span>` : ""}<span class="val">${esc(v)}</span>
    ${[e.confidence, e.status, e.attested, e.live ? "" : "superseded"].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    <span class="id">${esc(e.id)}</span></div>
    ${e.pattern ? `<div class="meta">pattern: <code>${esc(e.pattern)}</code></div>` : ""}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    ${e.refs?.length ? `<div class="meta">evidence: ${esc(e.refs.slice(0, 8).join("; "))}${e.refs.length > 8 ? " …" : ""}</div>` : ""}
    ${e.words?.length ? `<div class="meta">answers the search for: ${esc(e.words.join(", "))}</div>` : ""}
    <div class="meta">${esc(e.by)}, ${esc(e.date)}${e.method ? `, ${esc(e.method)}` : ""}${e.supersedes ? `, replaces <code>${esc(e.supersedes)}</code>` : ""}
    ${by.length ? `, replaced by <code>${esc(by.join(", "))}</code>` : ""}${e.page ? ` · page <a href="#${e.page}" onclick="tab='pages'">${esc(e.page)}</a>` : ""}</div></div>`;
}
let kind = "", showDead = false;
function kindFilter(k) { kind = k; showStore(); }
function showStore() {
  const q = fold($("#q").value.trim());
  const kinds = [...new Set(DATA.store.map(e => e.kind))].sort();
  const rows = DATA.store.filter(e => (showDead || e.live) && (!kind || e.kind === kind)
    && (!q || fold([e.id, e.source, typeof e.value === "string" ? e.value : JSON.stringify(e.value), e.note, (e.words || []).join(" "), e.refs.join(" ")].join(" ")).includes(q)));
  $("#main").innerHTML = `<h1>Store</h1><p>The checked facts the agents use: features and letter rules (observations), terms, formulas and names
    (decisions), and gaps. A change is a new entry that replaces the old one; both are kept.</p>
    <div class="filters"><select id="kind"><option value="">all kinds</option>${kinds.map(k => `<option ${k === kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
    <label><input type="checkbox" id="dead" ${showDead ? "checked" : ""}> show replaced entries</label></div>
    <div class="count">${rows.length} entries${q ? ` matching “${esc($("#q").value)}”` : ""}</div>`
    + rows.slice(0, 400).map(entryHtml).join("") + (rows.length > 400 ? `<p class="count">first 400 shown; narrow the search</p>` : "");
  $("#kind").onchange = ev => { kind = ev.target.value; showStore(); };
  $("#dead").onchange = ev => { showDead = ev.target.checked; showStore(); };
}
function showQuestions() {
  $("#main").innerHTML = `<h1>Open questions</h1><p>Questions the agents could not settle from the texts. Answer on the page, under the question.</p>`
    + DATA.questions.map(q => `<h3><a href="#${q.page}" onclick="tab='pages'">${esc(q.title)}</a></h3>${q.html}`).join("");
}
function search() {
  const raw = $("#q").value.trim(), q = fold(raw);
  if (tab === "store") return showStore();
  if (!q) return tab === "pages" ? showPage() : showQuestions();
  const hits = DATA.pages.map(p => { const t = fold(p.text), i = t.indexOf(q); return i < 0 ? null : {p, i, n: t.split(q).length - 1}; })
    .filter(Boolean).sort((a, b) => b.n - a.n);
  const st = DATA.store.filter(e => e.live && fold([e.id, e.source, e.value, e.note, (e.words || []).join(" ")].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Search: ${esc(raw)}</h1><div class="hits">` + hits.map(h => {
    const s = h.p.text.slice(Math.max(0, h.i - 90), h.i + q.length + 140);
    return `<div class="hit"><a href="#${h.p.id}" onclick="$('#q').value=''">${esc(h.p.title)}</a> <span class="count">(${h.n})</span><div class="snip">…${esc(s)}…</div></div>`;
  }).join("") + `</div>` + (st.length ? `<h2>Store (${st.length})</h2>` + st.slice(0, 60).map(entryHtml).join("") : "")
    + (!hits.length && !st.length ? `<p>Nothing found.</p>` : "");
}
function go() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  side();
  if ($("#q").value.trim()) return search();
  tab === "pages" ? showPage() : tab === "store" ? showStore() : showQuestions();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; go(); });
let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(go, 150); };
window.onhashchange = () => { const h = decodeURIComponent(location.hash.slice(1)); if (DATA.pages.some(p => p.id === h)) { page = h; tab = "pages"; $("#q").value = ""; go(); } };
const h0 = decodeURIComponent(location.hash.slice(1));
if (DATA.pages.some(p => p.id === h0)) page = h0; else if (["store", "questions"].includes(h0)) tab = h0;
else if (h0.startsWith("search=")) { tab = "pages"; $("#q").value = h0.slice(7); }
$("#credits").innerHTML = DATA.credits || "";
go();
</script>

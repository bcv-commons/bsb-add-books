ad, \"did waahn\" = wanted. Used in backgrounds (\"Iebriyam did bai da piis a lan\", the purchase before the burial) and pluperfects.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 3:34 a did", "JHN 1:1 did de bout", "GAL 4:22 Iebriyam did av", "ACT 7:16 did bai"], "live": true, "page": "grammar/verbs.md"}, {"id": "past_progressive", "kind": "feature", "source": null, "value": "\"did a\" + verb = was doing (past ongoing); the same string \"did a\" + noun is the past copula (was a …).", "pattern": "<subject> did a <verb>", "note": "Read \"did a\" by what follows: a verb (did a chrimbl, did a tiich) = progressive; a noun phrase (did a Aizak faada) = past copula. \"a did\" (Aizak a did Iebriyam pikni, LUK 3:34) is also the past copula.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 2:3 did a chrimbl", "LUK 17:28 did a nyam", "MAT 1:2 did a Aizak faada"], "live": true, "page": "grammar/verbs.md"}, {"id": "progressive", "kind": "feature", "source": null, "value": "Preverbal \"a\" marks an ongoing action, present or habitual: mi a tel unu (I am telling you).", "pattern": "<subject> a <verb>", "note": "pronoun + a + word: 1606× (this includes the copula a + noun). Plain present statements of a state use the bare verb (mi nuo, im lov). Negative: naa (mi naa go …).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:10 mi a beg", "1CO 1:12 Mi a fala", "LUK 15:7 Mi a tel unu"], "live": true, "page": "grammar/verbs.md"}, {"id": "future", "kind": "feature", "source": null, "value": "Future: \"ago\" + verb (most common), also \"gweehn\" + verb; \"wi\" + verb for will/shall in promises and predictions; negative future \"naa go\".", "pattern": "<subject> ago|gweehn|wi <verb>; <subject> naa go <verb>", "note": "ago 1573×, gweehn 119×, naa go 307×. \"wi\" is also the 1st plural pronoun: \"wi wi gwaan\" (we will go on, 2CO 4:11) has both. Do not write English \"will\".", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:19 Mi ago shuo", "1TI 2:15 Gad gweehn siev", "2CO 6:18 Mi wi bi", "1PE 2:6 naa go en op"], "live": true, "page": "grammar/verbs.md"}, {"id": "completive", "kind": "feature", "source": null, "value": "\"don\" before a verb marks a completed action (have already done); \"It don\" = it is finished.", "pattern": null, "note": "Less frequent than in speech; most English perfects are bare verbs (\"unu don rich\", 1CO 4:8, beside many plain verbs). Do not confuse with dong (down).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:7 don gi unu", "1CO 5:3 mi don joj", "JHN 19:30 It don nou"], "live": true, "page": "grammar/verbs.md"}, {"id": "modals", "kind": "feature", "source": null, "value": "Modals stand before the verb: kyan (can), kyaahn (cannot), kuda (could), kudn (could not), wuda (would), shuda (should), mos (must), afi (have to), maita (might); \"fi\" after the subject = should, ought to.", "pattern": null, "note": "kyan 776, kyaahn 376, kuda 199, kudn 147, wuda 300, shuda 26, mos 136, afi 290, maita 45. Commandments of the Law in quotations: \"Yu fi …\" (MRK 12:30, MAT 4:10); subject + fi + verb occurs 1574× (some of these are purpose fi).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:9 unu kyan chos", "LUK 1:7 kudn av non", "HEB 12:1 wi afi dash", "MRK 12:30 Yu fi lov", "1CO 8:11 maita tap"], "live": true, "page": "grammar/verbs.md"}, {"id": "copula", "kind": "feature", "source": null, "value": "Equative \"a\" links two noun phrases (X a Y); adjectives are predicates with no copula (im glad, not *im a glad); \"de\" = be somewhere, exist.", "pattern": "<NP> a <NP>; <NP> <adjective>; <NP> de <place>", "note": "pronoun + glad/sik/fried/beks/api with no copula 70×, with \"a\" 0×. Past: \"a did\" / \"did a\" + NP (LUK 3:34, MAT 1:2); \"did\" + adjective (did wel uol, LUK 1:7). Becoming: \"ton\" (ton king, 1CO 4:8; ton wan griet man, LUK 1:32) or \"komiin\" (come to be like).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["MRK 12:29 im a wan", "ACT 7:49 Evn a mi chuon", "LUK 15:5 yu so glad", "LUK 4:18 de pan mi"], "live": true, "page": "grammar/clauses.md"}, {"id": "existential", "kind": "feature", "source": null, "value": "There is / there was: \"yu (did) av\" + indefinite NP introduces a new participant; \"no de\" = there is not; \"de bout\" = exists.", "pattern": "(Nou) yu did av wan <noun> (niem <Name>)", "note": "\"yu did av\" 35× (often after Nou, at a story start). \"no de\" 53×.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 5:1 Nou yu did av", "ACT 8:9 yu did av wan", "1CO 1:7 notn no de", "JHN 1:1 did de bout"], "live": true, "page": "grammar/clauses.md"}, {"id": "focus_cleft", "kind": "feature", "source": null, "value": "Focus is put first with \"a\": A + focused phrase + rest of the clause (it is X who …). Also in questions: \"A uu …?\", \"A wa …?\". Negative focus: \"A no …\".", "pattern": "A <focus> <clause>", "note": "\"a im\" 308×, \"A no\" sentence-initial 54×, \"A wa/uu/ou\" 67×. Used for contrast and for \"it is … that\"; the Hebrew fronted object or subject can be rendered with it. The quotations show the object moved: \"A outa Iijip mi kaal mi bwai pikni\" (MAT 2:15).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 8:6 a im mek evriting", "MAT 2:15 A outa Iijip", "1CO 1:13 A uu ded", "1CO 1:2 A no jos"], "live": true, "page": "grammar/clauses.md"}, {"id": "constituent_order", "kind": "feature", "source": null, "value": "SVO. Object after the verb; no case marking on nouns or pronouns. Objects come before the verb only when fronted with focus \"a\" or in relative clauses.", "pattern": null, "note": "Derived report: VO 1,806 (63%), OV 780 (27%), SVO 162, OSV 47, SOV 42. The OV share comes from relative clauses (di sitn dem we wi kyan si), focus fronting and alignment noise; in a plain clause the object follows the verb.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["JHN 8:6 staat rait", "ACT 7:4 lef im konchri", "LUK 2:7 Shi rap im op"], "live": true, "page": "grammar/clauses.md"}, {"id": "negation", "kind": "feature", "source": null, "value": "Negation stands before the verb: no (present and general), neva (past: did not), neehn (past, also have not), naa (progressive/future), kyaahn (cannot). Negative concord: a negated verb takes no/nobadi/notn/neva in the object too.", "pattern": "<subject> no|neva|neehn|naa <verb> (no <noun>|notn|nobadi)", "note": "no 3487× (also as determiner), neva 505×, neehn 235×, naa 597×, kyaahn 376×, kudn 147×, wudn 68×. Negative concord (a second negative within 30 letters) in 975 verses. The priors' duon, kyaan, noh, nonaa do not occur. \"na'av\" = does not have (JHN 2:3).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 1:7 neva av no pikni", "JHN 1:3 Notn no de", "HEB 11:5 im neehn ded", "LUK 15:4 Yu naa go", "1CO 2:4 neva yuuz no"], "live": true, "page": "grammar/clauses.md"}, {"id": "prohibitive", "kind": "feature", "source": null, "value": "Prohibitions: \"No\" + verb (do not …); emphatic \"No bada\" + verb (don't bother to …).", "pattern": null, "note": "\"No fried\" (do not be afraid) 38×. Plural addressees: same form (no unu before it unless emphatic).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 1:13 No fried!", "MAT 4:7 No tes", "ROM 12:19 no bada tek"], "live": true, "page": "grammar/verbs.md"}, {"id": "hortative", "kind": "feature", "source": null, "value": "\"Let us\" = Mek wi + verb; \"let him/them\" = mek + subject + verb; the same mek is the causative (make someone do).", "pattern": "Mek wi <verb>; Mek <NP> <verb>", "note": "Of BSB verses with \"let us\", 32 have mek wi, 7 another mek, 10 \"kom\" (Kom mek …, JHN 11:16). \"Mek wi\" 201× in all. The derived report found \"nothing\" for the 1st plural subjunctive: that is wrong, the construction is mek wi. Jussive \"Let there be light\" has its model in 2CO 4:6 \"Mek di lait shain\".", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["MRK 1:38 Mek wi go", "1JN 4:7 mek wi lov", "LUK 15:23 Mek wi nyam", "2CO 4:6 Mek di lait shain"], "live": true, "page": "grammar/verbs.md"}, {"id": "serial_verbs", "kind": "feature", "source": null, "value": "Verbs are strung without \"and\" or \"to\": go + verb (go tel), kom + verb (kom kom tel = came to tell), tek X go/kom (take X to), gi = to/for after an object (bon sakrifais gi Gad).", "pattern": null, "note": "go a 278×, kom bak 331×, kom fram 257×; \"kom kom\" (came to …) 52×.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:23 kom kil it", "HEB 11:4 sakrifais gi Gad", "LUK 2:15 Betliyem go si", "1PE 1:12 kom kom tel"], "live": true, "page": "grammar/verbs.md"}, {"id": "passive", "kind": "feature", "source": null, "value": "No passive morphology. A passive is rendered (1) with get + verb (get siev, get baptaiz), (2) with the bare verb and the patient as subject (di evn an di ort did mek), or (3) with impersonal \"dem\" as subject (dem kaal …).", "pattern": null, "note": "get + verb in total 1229× (get also = receive, become). \"we dem kaal\" (called, named) 35×; \"we niem\" 37×. 1TI 2:13 \"Adam did mek bifuo Iiv\" (Adam was formed first).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 10:33 get siev", "1CO 1:15 get baptaiz", "2PE 3:5 did mek jos so", "ACT 3:2 we dem kaal"], "live": true, "page": "grammar/verbs.md"}, {"id": "reduplication", "kind": "feature", "source": null, "value": "Doubling a word intensifies an adjective or adverb (big big, nof nof, brait brait), makes a distributive (difrant difrant), or an iterative (kot op kot op); \"faada faada\" = forefathers, \"pikni pikni\" = grandchildren.", "pattern": null, "note": "Doubled words 923× in all; most frequent: de de (148, locative de + de there), faada faada 61, kom kom 56, aad aad 50, nof nof 49, gud gud 36, big big 36, brait brait 30. Hyphenated doubles are separate words: dege-dege (only, mere), fuul-fuul, fasi-fasi. Priors listed no verb doubling; there is none as a grammatical category apart from these.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 10:11 big big shiit", "1CO 2:6 nof nof", "1CO 15:38 difrant difrant", "2PE 3:4 Wi faada faada", "ACT 19:16 kot op kot op"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "comparison", "kind": "feature", "source": null, "value": "Comparatives: (muo/muor) + adjective + dan, or the old forms beta, biga, wosa, aiya; superlative: di muos + adjective, or -is (liklis).", "pattern": null, "note": "Derived report: Greek comparatives rendered with dan ×59, elda ×52, muo ×29, biga ×20, beta ×14, iiziya ×11. dan 250× in all; \"di muos\" 17×. The priors' -a comparative and -is superlative as productive endings were not found: -a/-ya appears only in a few lexical forms (iiziya, biga, beta).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["HEB 11:4 beta sakrifais", "MAT 10:15 iiziya dan", "MRK 12:29 Di muos impuotant", "MAT 5:18 liklis leta"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "article", "kind": "feature", "source": null, "value": "Definite article di; indefinite wan (also \"one\"); bare nouns for generic or mass reference.", "pattern": null, "note": "di 11129×, wan 3356× (with \"one\" and \"wan aneda\"). Derived report: Greek article ὁ = di 45%, none 43%. Priors: wahn ABSENT. Names and Gad take no article; \"di Laad\" does.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:4 di nainti-nain", "ACT 5:1 wan man", "LUK 15:1 Di taks kalekta"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "plural", "kind": "feature", "source": null, "value": "Plural is a separate word \"dem\" after the noun phrase (di piipl dem, im falara dem); it is left out after numerals and quantifiers and with generic nouns.", "pattern": "(di) <noun> dem", "note": "\"di N dem\" 2147×; piipl dem 859×. Counter-cases: tuu bwai pikni (GAL 4:22) with a numeral and no dem, beside twelv … pikini dem (ACT 7:8). One dem covers a coordinated phrase (fren an nieba dem). Never an -s plural on native words (tingz, ada a fixed form). Priors' \"-dem as suffix\": not a suffix, written apart.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:1 di sina dem", "LUK 15:6 fren an nieba dem", "ACT 7:8 twelv bwai pikini dem", "GAL 4:22 tuu bwai pikni"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "demonstratives", "kind": "feature", "source": null, "value": "This = da N ya / dis N; that = da N de; these = dem N ya / dem ya N; those = dem N de. The noun sits between da/dem and ya/de.", "pattern": "da <noun> ya | da <noun> de | dem <noun> de", "note": "da … ya 298×, da … de 239×, dem … de 319×, dis + noun 249×. \"ya-so\" = here, \"de-so\" = there. \"ya\" alone after a noun: di man ya (this man).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:3 da tuori ya", "ACT 7:16 piis a lan de", "HEB 10:6 dem sitn de", "JHN 14:31 da plies ya"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "pronouns", "kind": "feature", "source": null, "value": "One form for subject, object and possessor: mi, yu (sg), im (he/him/his, also it), shi / ar (she / her), it, wi, unu (you pl), dem. Reflexive: -self (imself, unuself).", "pattern": null, "note": "mi 5341, yu 2407, im 7989, shi 308, it 1582, wi 4123, unu 5876, dem 12534 (also plural and demonstrative). In 129 verses where the BSB has she/her and no he/him/his/they: shi 161, ar 145, im 32: women are shi/ar, im for a woman is the exception. ar also means \"or\". The priors' i is ABSENT. unu is strictly plural: a drafter must decide singular yu or plural unu from the Hebrew (Greek σύ/ὑμεῖς: unu 58%, yu 30%).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:9 shi kaal out ar", "1CO 1:10 mi a beg unu", "LUK 15:7 Mi a tel unu", "2CO 4:6 mek im lait shain"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "possessor", "kind": "feature", "source": null, "value": "Possessor before the possessed with nothing between (Gad kindom, Lat waif); emphatic or predicative \"fi\" + possessor (fi mi Laad, a fi dem); \"a\" links in some fixed phrases (di Spirit a di Laad, di King a Iijip).", "pattern": "<possessor> <noun> | fi <possessor> <noun>", "note": "fi + pronoun 904× (also purpose fi + object pronoun); Gad kindom ×35 for ἡ βασιλεία τοῦ θεοῦ (derived report). Contractions fi'im (his, 65×) and fu'unu (your pl, 52×) appear in Acts and later books. Priors: fi-mi etc. hyphenated ABSENT: written apart.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 17:32 Lat waif", "MAT 22:44 fi mi Laad", "LUK 4:18 Spirit a di Laad", "ACT 7:10 di King a Iijip"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "relative_clause", "kind": "feature", "source": null, "value": "Relative clauses follow the noun and open with \"we\" (who, which, that) for subject and object alike; no resumptive pronoun. \"uu\" is the question word, not a relative.", "pattern": null, "note": "Derived report: ὅς = we 31%, none 48%. \"dem we\" (those who) 1340×; \"piipl we\" 488×. we also = where/away (\"go we\", \"we im de?\"). Whose = uufa (fi ar pikni …, uufa pet niem, JHN 11:16). The OT \"the LORD your God\" is built with a relative: di Laad we a yu Gad.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:7 wan sina we ton", "MAT 4:7 di Laad we a", "ACT 17:24 Di Gad we mek"], "live": true, "page": "grammar/clauses.md"}, {"id": "complementizer_se", "kind": "feature", "source": null, "value": "\"se\" introduces the content of saying, knowing, thinking, seeing (that …), and is repeated after the speech verb before a quotation.", "pattern": null, "note": "nuo se 313, tingk se 152, si se 126. Derived report: ὅτι = se 47%, kaaz 17%, kaa 8%. A causal ὅτι/כִּי is kaaz, not se.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:2 grombl se", "1CO 1:9 chos se", "HEB 11:20 biliiv se"], "live": true, "page": "grammar/clauses.md"}, {"id": "speech_frame", "kind": "feature", "source": null, "value": "Speech is framed \"<speaker> se (tu <addressee>) se, “…”\": the verb se (say) and then the complementizer se again. Also aks <X> se, ansa (<X>) se, tel <X> se.", "pattern": "<speaker> se tu <addressee> se, “<quote>”", "note": "\"se tu X se\" 355× (+ 22 with a two-word addressee); \"se,\" before an opening quote mark 1472×; aks X se 118×; ansa (X) se 83×. Derived report: καί λέγω αὐτός = \"an se\" (13 of 162). Counter-cases: the frame may also follow or be left out (Jiizas ansa bak, “…”, MAT 4:10).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:7 se tu dem se", "MAT 4:7 Jiizas ansa im se", "LUK 15:12 tu im faada se", "ACT 7:2 ansa an se"], "live": true, "page": "grammar/connectors.md"}, {"id": "quotation_marks", "kind": "feature", "source": null, "value": "Double curly quotes “…” for speech, single ‘…’ for speech inside speech.", "pattern": null, "note": "project.yaml quotes: “”. A quotation inside a quotation uses ‘ ’ (LUK 15:6), a third level “ ” again (MAT 22:44).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:6 ‘Kom selibriet", "MAT 22:44 Di Laad se"], "live": true, "page": "grammar/connectors.md"}, {"id": "connective_sequence", "kind": "feature", "source": null, "value": "Narrative clauses open with An (and), Den (then), So (so, and so), Nou (now, a new scene), Wen (when), Afta dat (after that), Bot (but). καί is \"an\" or nothing; δέ is bot or nothing; τότε is den.", "pattern": null, "note": "Sentence-initial words: An 1,037, So 934, Bot 893, Wen 618, Den 436, Nou 258, Afta 206. Derived report at clause start: καί an 50% / none 37%; δέ bot 39% / none 52%; τότε den 65%; οὖν so 43%, den 18%. Hebrew wayyiqtol chains: do not start every clause with An; the corpus links two or three verbs with an and starts new sentences with So/Den/Wen.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:11 Den Jiizas se", "LUK 15:3 So Jiizas ansa", "ACT 5:1 Nou yu did av", "LUK 15:13 Likl afta dat"], "live": true, "page": "grammar/connectors.md"}, {"id": "causal", "kind": "feature", "source": null, "value": "Because / for: kaaz (main form), kaa (short form, same use), sieka (because of + noun phrase).", "pattern": null, "note": "kaaz 1573×, kaa 232×, sieka 204×. Derived report: γάρ kaaz 56%, kaa 8%, none 37%. The priors' bikaa and \"kaaz a\" are ABSENT.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 1:7 kaaz Ilizibet", "1PE 1:7 kaa guol", "1CO 8:11 sieka wa unu du"], "live": true, "page": "grammar/connectors.md"}, {"id": "conditional", "kind": "feature", "source": null, "value": "If = ef. There is no \"if\".", "pattern": null, "note": "ef 936×; \"if\" occurs only in the compound if-an-bot. Counterfactual: wuda (Wi wuda don fa, ROM 9:29).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["GAL 6:9 ef wi no gi", "ROM 9:29 Ef di Laad"], "live": true, "page": "grammar/connectors.md"}, {"id": "purpose", "kind": "feature", "source": null, "value": "Purpose: fi + verb (to, in order to), so (dat) + clause (so that).", "pattern": null, "note": "Derived report: ἵνα so 27%, fi 25%, dat 13%. fi + du 678×. Negative purpose: so … no / so dat … naa (so unu no en op, 1PE 3:16).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:1 fi ier", "HEB 11:7 fi siev im fambili", "1CO 10:33 so dat evribadi"], "live": true, "page": "grammar/connectors.md"}, {"id": "prepositions", "kind": "feature", "source": null, "value": "Main prepositions: iina (in, into), a (at, to a place: go a el), pan (on, upon), wid (with), fram (from), tu (to a person), outa (out of), bout (about), uova (over), anda (under), infronta (before, in front of), mongks (among), gens (against), saida (beside), baka (behind, back to).", "pattern": null, "note": "iina 3059, pan 1245, wid 1385, fram 1165, tu 2629, infronta 165, mongks 170, gens 210. Derived report: ἐν iina 31% / a 10% / pan 5%; εἰς iina 26%, go 18%, a 17%. Priors: ina, ova, kaaz a ABSENT; it is iina, uova.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-derived", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:2 iina", "LUK 15:6 go a yu yaad", "LUK 15:5 pan yu shuolda", "MAT 22:44 anda yu fut"], "live": true, "page": "grammar/connectors.md"}, {"id": "questions", "kind": "feature", "source": null, "value": "Question words: wa (what), uu (who), uufa (whose), ou (how), wich paat (where), wen (when), wa mek (why), wa kaina (what kind). Yes/no questions keep statement order; tags iihn? and duohn?.", "pattern": null, "note": "wich paat 141×; \"we paat\" 16×; wa mek 49×, fi wa 28×; wai only 6×. iihn 36×. Rhetorical: \"A …\" + question word.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["1CO 1:13 A uu ded", "ACT 1:11 wa mek unu", "1CO 15:55 A wich paat", "2PE 3:4 duohn?"], "live": true, "page": "grammar/clauses.md"}, {"id": "time_expressions", "kind": "feature", "source": null, "value": "Time: wan die (one day), di neks die (the next day), afta dat, wen it kech <time> (when it came to …), \"Wen taim did staat\" (in the beginning).", "pattern": null, "note": "Days counted with die: di fos die, die sevn (HEB 4:4: number after die), di sevn die. \"fram Gad mek di worl\" = from the creation, from the beginning (MAT 19:4, ROM 1:20).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["JHN 1:1 Wen taim did staat", "MRK 15:34 Wen it kech", "MRK 4:35 wen it kech iivnin"], "live": true, "page": "grammar/connectors.md"}, {"id": "numerals", "kind": "feature", "source": null, "value": "Numbers are written as words: wan, tuu, chrii, fuo, faiv, siks, sevn, iet, nain, ten, ilevn, twelv, twenti, fifti, onjrid, touzn; compounds with a hyphen (nainti-nain, twenti-fuo). Digits are rare.", "pattern": null, "note": "Digit tokens only 14× in 7 verses (e.g. measures converted, REV 21:17). Ordinals: fos, sekan; \"die sevn\". 12,000 = twelv touzn.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:4 onjrid shiip", "REV 7:5 twelv touzn", "ACT 7:6 fuo onjrid ier", "LUK 15:4 nainti-nain"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "contractions", "kind": "feature", "source": null, "value": "Some pronoun and verb pairs are written contracted with an apostrophe: fi'im (his/for him), fu'unu (your pl), dwi'it (do it), gi'im (give him), si'it (see it), na'av (not have), na'afi (not have to).", "pattern": null, "note": "fi'im 65, fu'unu 52, dwi'it 42, na'av 16, gi'im 11. They are concentrated in some books (Acts, John); elsewhere the full forms (fi im, fi unu) are usual. Optional; a draft may use the full forms.", "words": null, "confidence": "medium", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 4:12 fi'im niem", "ACT 3:22 fu'unu Gad", "JHN 2:5 dwi'it", "JHN 2:3 na'av"], "live": true, "page": "grammar/nouns-pronouns.md"}, {"id": "discourse_markers", "kind": "feature", "source": null, "value": "Attention and emphasis: Luk ya (look, behold), Lisn (listen), Wach it (watch out / behold), Matarafak (in fact), iivn (even), jos (just).", "pattern": null, "note": "\"behold\" in the BSB: luk 11, lisn 6 (lexicon). Luk ya 22×. Hebrew הִנֵּה is far more frequent than these models: often leave it out or use Luk ya / Wach ya nou in speech.", "words": null, "confidence": "medium", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["MAT 1:20 wach ya nou", "MAT 1:23 Lisn op!", "HEB 8:8 Wach it", "JHN 1:1 Matarafak"], "live": true, "page": "grammar/connectors.md"}, {"id": "style_explicit", "kind": "feature", "source": null, "value": "The corpus is a meaning-based translation: it spells out implicit information, explains customs and turns abstract nouns into clauses (birthright = \"everything Esau would get because he was his father's first son\").", "pattern": null, "note": "Abstract nouns become verbs (faith = chos iina Gad / biliiv; salvation = siev; righteousness = du wa rait). Measures are converted (cubits to fut, REV 21:17). A draft that copies the BSB's abstract nouns falls back on English.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["HEB 12:16 fos bwai pikni", "HEB 7:4 wan outa evri ten", "REV 21:17 fut ai", "COL 1:15 siem laik im Faada"], "live": true, "page": "style.md"}, {"id": "letter:long_vowels", "kind": "letter", "source": null, "value": "Long vowels are written double: aa (faada, laad, aal), ii (piipl, iina, biliiv), uu (juu, fuud, nyuu). There is no ee or oo except before hn (neehn, gweehn).", "pattern": null, "note": "words with aa 13067, ii 15173, uu 3639 tokens. English \"ee/ea\" → ii (siid, priis), \"oo\" → uu (fuud, gruup), \"or/ar/aw\" → aa (laad, staat, laa).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:12 faada", "LUK 15:7 piipl", "LUK 15:2 Farisii", "ACT 7:11 fuud"], "live": true, "page": "orthography.md"}, {"id": "letter:ie_uo", "kind": "letter", "source": null, "value": "The gliding vowels: ie for English \"ay/ai/a_e\" (siem, niem, die, fies), uo for \"o/oa/ow\" (nuo, shuo, uol, kuot).", "pattern": null, "note": "ie 7021, uo 5993 tokens: siem, ier, wie, die, prie, niem; nuo, uol, shuo, uova, bifuo. Names follow: Iebriyam, Muoziz, Juozif.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 7:49 Di Laad se", "LUK 15:3 tuori", "ACT 5:1 niem"], "live": true, "page": "orthography.md"}, {"id": "letter:ai_ou", "kind": "letter", "source": null, "value": "ai for English \"i_e/y\" (taim, laik, krais), ou for \"ou/ow\" (ous, out, toun, roun).", "pattern": null, "note": "ai 8449, ou 5304 tokens.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:8 lait lamp", "LUK 15:6 yaad", "LUK 15:8 di ous"], "live": true, "page": "orthography.md"}, {"id": "letter:short_vowels", "kind": "letter", "source": null, "value": "Short vowels: a for English short o and short a (gad, lat, kat, man), o for English short u (lov, blod, son, kom), i for short i, e for short e.", "pattern": null, "note": "God = Gad, Lot = Lat, love = lov, blood = blod, come = kom, sun = son (no distinction from son!), church = choch, worship = worship, serve = sorv (English \"ur/er/ir\" = o/or).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 17:32 Lat waif", "JHN 8:6 fingga", "1CO 1:2 Gad"], "live": true, "page": "orthography.md"}, {"id": "letter:no_h", "kind": "letter", "source": null, "value": "English initial h is not written: ous (house), im (him), ier (hear, year, here), api (happy), el (hell), ed (head), ai (high).", "pattern": null, "note": "h appears only in sh, ch, zh (iezha) and in the nasal spelling -hn (waahn, kyaahn, neehn). No c (except ch), q, x or th: th = t or d (ting, di, dat, Set for Seth).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:8 di ous", "LUK 15:1 fi ier", "LUK 1:32 Muos Ai Gad"], "live": true, "page": "orthography.md"}, {"id": "letter:nasal_hn", "kind": "letter", "source": null, "value": "A nasalised vowel is written with hn after it: waahn (want), kyaahn (cannot), neehn (did not), gweehn (going to), iihn (eh?).", "pattern": null, "note": "waahn 770, kyaahn 376, neehn 235, gweehn 119, iihn 36, wehn 23. Keep kyan (can) and kyaahn (cannot) apart: the hn is the negation.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 5:4 did waahn", "ROM 1:20 kyaahn", "HEB 11:5 neehn", "LUK 1:32 gweehn"], "live": true, "page": "orthography.md"}, {"id": "letter:palatals", "kind": "letter", "source": null, "value": "After k and g before a, a y is written (kyan, kyari, gyal, gyaadn); ny for an initial palatal n (nyam, nyuu).", "pattern": null, "note": "ky 1,488 tokens (kyan, kyari, kyamil), gy 355 (gyada, Gyalalii, gyaadn), ny 490 (nyam, nyuuz). Not every k/g + a: Gad, kaal, gaan, kaaz have none.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:23 kyaaf", "MAT 3:4 Kyamil", "LUK 15:23 Mek wi nyam"], "live": true, "page": "orthography.md"}, {"id": "letter:ch_j", "kind": "letter", "source": null, "value": "English tr- and thr- are written chr- (chrii = three and tree, chrang, chuu = through and true), dr- is jr- (jriim, jringk).", "pattern": null, "note": "chrii 203 (three, tree), chuu 527 (true, through), chuut (truth), chrang 208 (strong), jringk 124.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["MRK 15:34 chrii aklak", "LUK 17:27 jringk"], "live": true, "page": "orthography.md"}, {"id": "letter:final_er", "kind": "letter", "source": null, "value": "Unstressed final English -er/-or/-a is written a: faada, mada, breda, sista, ova = uova, afta, neva, ruula, tiicha.", "pattern": null, "note": "faada 624, breda 354, neva 505, afta 379. English -ear/-air/-are = ier (ier, kier, shier, swier).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:12 faada", "MAT 19:5 mada", "LUK 15:5 shuolda"], "live": true, "page": "orthography.md"}, {"id": "letter:syllabic", "kind": "letter", "source": null, "value": "Unstressed syllables with l or n are written without a vowel: likl, onggl (only), gyaadn, mountn, iivn (heaven = evn, even = iivn), baptaiz; -ing is -in or -n (iivnin, maanin, wedn).", "pattern": null, "note": "onggl 346, iivn 344, evn (heaven) 170 in the lexicon. Variants: mountn 20 / moutn 7.", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:13 Likl afta dat", "MRK 4:35 iivnin", "JHN 14:31 onggl"], "live": true, "page": "orthography.md"}, {"id": "letter:clusters", "kind": "letter", "source": null, "value": "Final consonant clusters lose their last consonant: lan (land), fiil (field), tel, ol, wel, chos (trust), ges (guest), fren (friend); voiced -s is z (kaaz, Muoziz, tingz).", "pattern": null, "note": "Exceptions keep a cluster where English has one stressed (staat, paat, aks). Plural -z on borrowed nouns (tingz, nyuuz).", "words": null, "confidence": "high", "status": "observed", "attested": null, "method": "corpus-observed", "by": "agent:memory-setup", "date": "2026-10-16", "supersedes": null, "refs": ["LUK 15:4 iina di fiil", "LUK 15:6 fren an nieba", "LUK 1:7 kaaz"], "live": true, "page": "orthography.md"}, {"id": "letter:names", "kind": "letter", "source": null, "value": "New names are spelled as an English speaker pronounces the English form, in the same phonemic des": null, "refs": ["MRK 15:37 bluo im bret"], "live": true, "page": "vocabulary.md"}, {"id": "formula:it_was_so", "kind": "formula", "source": "וַיְהִי כֵן / and it was so", "value": "An a so it apm.", "pattern": null, "note": "Focus a + so (as the wiki proposed); the same at every וַיְהִי כֵן in GEN 1 (7, 9, 11, 15, 24, 30).", "words": ["and it was so", "it was so"], "confidence": "medium", "status": "open", "attested": "by-rule", "method": "project-decision", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["JAS 2:23 So it apm", "GEN 1:7 a so it apm"], "live": true, "page": "formulas.md"}, {"id": "formula:evening_morning", "kind": "formula", "source": "וַיְהִי עֶרֶב וַיְהִי בֹקֶר יוֹם … / and there was evening, and there was morning, the … day", "value": "Iivnin kom, an maanin kom: dat a did di <ordinal> die.", "pattern": null, "note": "Refrain of GEN 1 (5, 8, 13, 19, 23, 31): 'a did' as the past copula (LUK 3:34).", "words": ["there was evening", "there was morning", "evening", "morning"], "confidence": "medium", "status": "open", "attested": "by-rule", "method": "project-decision", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["MAT 8:16 Wen iivnin kom", "GEN 1:5 maanin kom"], "live": true, "page": "formulas.md"}, {"id": "formula:called_x_y", "kind": "formula", "source": "וַיִּקְרָא … לְ / called X Y", "value": "<subject> kaal <X> “<Y>”", "pattern": null, "note": "Naming: Gad kaal di lait “Die”; a fronted object keeps its place: an di daak im kaal “Nait” (GEN 1:5, 10).", "words": ["called"], "confidence": "medium", "status": "open", "attested": "by-rule", "method": "project-decision", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["ACT 6:9 dem kaal demself", "GEN 1:5 kaal di lait"], "live": true, "page": "formulas.md"}, {"id": "term:ordinals", "kind": "term", "source": "ordinal numbers", "value": "fos, sekan, tord, fuot, fif, siks", "pattern": null, "note": null, "words": ["first", "second", "third", "fourth", "fifth", "sixth"], "confidence": "high", "status": "observed", "attested": "attested", "method": "corpus-observed", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["REV 4:7 di tord wan", "REV 9:1 di fif ienjel", "REV 6:12 di siks chring"], "live": true, "page": "vocabulary.md"}, {"id": "term:very_good", "kind": "term", "source": "H3966", "value": "wel gud", "pattern": null, "note": "wel + adjective intensifies (wel daak, wel torbl, wel glad); GEN 1:31 'it wel gud'. gud gud is mostly 'dear' (gud gud fren).", "words": ["very good", "very"], "confidence": "medium", "status": "open", "attested": "by-rule", "method": "project-decision", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["MAT 6:23 yu wel daak"], "live": true, "page": "vocabulary.md"}, {"id": "term:lights_luminaries", "kind": "term", "source": "H3974", "value": "lait", "pattern": null, "note": "מְאֹרֹת = lait dem; to shine/give light = gi lait (GEN 1:15, 17).", "words": ["lights", "light"], "confidence": "high", "status": "open", "attested": "by-rule", "method": "project-decision", "by": "agent:gen001", "date": "2026-10-16", "supersedes": null, "refs": ["GEN 1:14 Mek lait dem de"], "live": true, "page": "vocabulary.md"}], "questions": [{"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>How close to the Hebrew?<\/strong> The Jamaican NT is meaning-based: it explains customs, converts measures and turns abstract nouns into clauses (<a href=\"#style.md\">style<\/a>). Should the OT follow the same style, or keep closer to the Hebrew wording?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>The LORD (YHWH):<\/strong> the proposal is <em>di Laad<\/em>, as in the NT's quotations (MAT 4:7). Does the team want a different form for the divine name (e.g. a name, or <em>LAAD<\/em> in capitals)? And <em>di Laad Gad<\/em> for YHWH Elohim (GEN 2–3)?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>El Shaddai, LORD of Hosts:<\/strong> the NT uses relative clauses (\"di Laad we av aal a di powa\", ROM 9:29; \"di Laad we ruul uova evriting\", JAS 5:4). Which one should be fixed for the OT?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Covenant (בְּרִית):<\/strong> <em>pramis<\/em> (35%), <em>plan<\/em> (30%) or <em>diil<\/em> (11%)? <em>pramis<\/em> is also \"promise\" and \"oath\"; Genesis 9, 15 and 17 make the covenant central.<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Gad, God and the tribe:<\/strong> the corpus writes God and the son of Jacob the same (REV 7:5). Should Gad the son (GEN 30:11, 49:19) be spelt differently?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Names the NT lacks:<\/strong> built by rule from the English pronunciation (Iebram, Sierai, Ishmiel, Liiya, Lieban, Iidn, Am, Jiefet, Biebl): are these the forms the team wants? Should they follow English pronunciation as the NT does, or the Hebrew?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Measures:<\/strong> REV 21:17 converts cubits to feet. Convert the ark's measures (GEN 6:15), or keep cubits with an explanation?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>חֶסֶד (loving devotion):<\/strong> <em>kain<\/em> / \"gud an kain tu\" in the NT. Is there a fixed phrase for God's faithful love (Psalms, Genesis 24:27, 32:10)?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Glory:<\/strong> no single word (<em>brait lait<\/em>, <em>priez<\/em>, <em>rispek<\/em>). What should the OT use for God's glory?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Genesis 1 refrains:<\/strong> \"evening and morning, the first day\", \"and it was so\", \"according to its kind\": the corpus has no model. Proposals are on <a href=\"#formulas.md\">formulas<\/a> and <a href=\"#gaps.md\">gaps<\/a>.<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>Contractions<\/strong> (fi'im, fu'unu, na'av, dwi'it): they appear in some NT books only. Should drafts use them or the full forms?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>The book title<\/strong> of Genesis and the chapter word: the corpus has no OT book; project.yaml has <code>chapter_word: Chapter<\/code> from the edition's headings. What should Genesis be called?<\/p>"}, {"page": "questions.md", "title": "Questions for the language team", "html": "<p><strong>\"unu\" vs \"yu\":<\/strong> God addressing Adam and Eve together, or a crowd: the drafts will use <em>unu<\/em> for every plural \"you\". Is that right in solemn speech (blessings, laws)?<\/p>"}], "credits": "<h1>Credits<\/h1>\n<p>Our work in this folder (drafts, notes, the wiki's prose, the language store, statistics) is dedicated to the public domain (CC0 1.0). We learned from and quote the editions below (docs/licensing.md).<\/p>\n<p>Quoted in short passages, with references, under the quotation right and the edition's own terms; <strong>these quotations are not covered by CC0<\/strong> and stay with their owners:<\/p>\n<ul><li>Di Jamiekan Nyuu Testiment, Bible Text in Jamaican Creole © Bible Society of the West Indies (https://www.bible.is/bible/JAMBSW)<\/li><\/ul>"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ᷀-᷿꞉]/g, "").toLowerCase();
let tab = "pages", page = "index.md";
const HELP = `<div class="help">This is a read-only copy, built by <code>python3 scripts/wiki.py view ${esc(DATA.project)}</code>.
To add what you know, edit the page's <code>.md</code> file in <code>wiki/</code>, or send the text to whoever keeps it.
To correct a fact, write under it: <code>&gt; **Correction (your name, date):** …</code>. The next agent turns it into a store entry.
The grey "Store entries" boxes are generated from the store; don't edit them by hand.</div>`;

function side() {
  if (tab !== "pages") { $("#side").innerHTML = sideCounts(); return; }
  const g = {top: [], grammar: [], end: []};
  DATA.pages.forEach(p => (p.id.startsWith("grammar/") ? g.grammar : ["inbox.md", "log.md"].includes(p.id) ? g.end : g.top).push(p));
  const n = id => DATA.store.filter(e => e.live && e.page === id).length;
  const link = p => `<a href="#${p.id}" class="${p.id === page ? "on" : ""}">${esc(p.title)}${n(p.id) ? `<span class="n">${n(p.id)}</span>` : ""}</a>`;
  $("#side").innerHTML = g.top.map(link).join("") + `<div class="grp">Grammar</div>` + g.grammar.map(link).join("")
    + `<div class="grp">Upkeep</div>` + g.end.map(link).join("");
}
function sideCounts() {
  const live = DATA.store.filter(e => e.live), c = {};
  live.forEach(e => c[e.kind] = (c[e.kind] || 0) + 1);
  return `<div class="grp">Store</div>` + Object.entries(c).sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `<a href="javascript:void(0)" onclick="kindFilter('${k}')">${esc(k)}<span class="n">${v}</span></a>`).join("")
    + `<div class="grp">Totals</div><a>live<span class="n">${live.length}</span></a><a>superseded<span class="n">${DATA.store.length - live.length}</span></a>`;
}
function showPage() {
  const p = DATA.pages.find(p => p.id === page) || DATA.pages[0];
  $("#main").innerHTML = (p.id === "index.md" ? HELP : "") + p.html;
  window.scrollTo(0, 0);
}
function entryHtml(e) {
  const v = typeof e.value === "string" ? e.value : JSON.stringify(e.value);
  const by = DATA.store.filter(x => x.supersedes === e.id).map(x => x.id);
  return `<div class="entry ${e.live ? "" : "dead"}"><div class="top"><span class="tag kind">${esc(e.kind)}</span>
    ${e.source ? `<span>${esc(e.source)} →</span>` : ""}<span class="val">${esc(v)}</span>
    ${[e.confidence, e.status, e.attested, e.live ? "" : "superseded"].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
    <span class="id">${esc(e.id)}</span></div>
    ${e.pattern ? `<div class="meta">pattern: <code>${esc(e.pattern)}</code></div>` : ""}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
    ${e.refs?.length ? `<div class="meta">evidence: ${esc(e.refs.slice(0, 8).join("; "))}${e.refs.length > 8 ? " …" : ""}</div>` : ""}
    ${e.words?.length ? `<div class="meta">answers the search for: ${esc(e.words.join(", "))}</div>` : ""}
    <div class="meta">${esc(e.by)}, ${esc(e.date)}${e.method ? `, ${esc(e.method)}` : ""}${e.supersedes ? `, replaces <code>${esc(e.supersedes)}</code>` : ""}
    ${by.length ? `, replaced by <code>${esc(by.join(", "))}</code>` : ""}${e.page ? ` · page <a href="#${e.page}" onclick="tab='pages'">${esc(e.page)}</a>` : ""}</div></div>`;
}
let kind = "", showDead = false;
function kindFilter(k) { kind = k; showStore(); }
function showStore() {
  const q = fold($("#q").value.trim());
  const kinds = [...new Set(DATA.store.map(e => e.kind))].sort();
  const rows = DATA.store.filter(e => (showDead || e.live) && (!kind || e.kind === kind)
    && (!q || fold([e.id, e.source, typeof e.value === "string" ? e.value : JSON.stringify(e.value), e.note, (e.words || []).join(" "), e.refs.join(" ")].join(" ")).includes(q)));
  $("#main").innerHTML = `<h1>Store</h1><p>The checked facts the agents use: features and letter rules (observations), terms, formulas and names
    (decisions), and gaps. A change is a new entry that replaces the old one; both are kept.</p>
    <div class="filters"><select id="kind"><option value="">all kinds</option>${kinds.map(k => `<option ${k === kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
    <label><input type="checkbox" id="dead" ${showDead ? "checked" : ""}> show replaced entries</label></div>
    <div class="count">${rows.length} entries${q ? ` matching “${esc($("#q").value)}”` : ""}</div>`
    + rows.slice(0, 400).map(entryHtml).join("") + (rows.length > 400 ? `<p class="count">first 400 shown; narrow the search</p>` : "");
  $("#kind").onchange = ev => { kind = ev.target.value; showStore(); };
  $("#dead").onchange = ev => { showDead = ev.target.checked; showStore(); };
}
function showQuestions() {
  $("#main").innerHTML = `<h1>Open questions</h1><p>Questions the agents could not settle from the texts. Answer on the page, under the question.</p>`
    + DATA.questions.map(q => `<h3><a href="#${q.page}" onclick="tab='pages'">${esc(q.title)}</a></h3>${q.html}`).join("");
}
function search() {
  const raw = $("#q").value.trim(), q = fold(raw);
  if (tab === "store") return showStore();
  if (!q) return tab === "pages" ? showPage() : showQuestions();
  const hits = DATA.pages.map(p => { const t = fold(p.text), i = t.indexOf(q); return i < 0 ? null : {p, i, n: t.split(q).length - 1}; })
    .filter(Boolean).sort((a, b) => b.n - a.n);
  const st = DATA.store.filter(e => e.live && fold([e.id, e.source, e.value, e.note, (e.words || []).join(" ")].join(" ")).includes(q));
  $("#main").innerHTML = `<h1>Search: ${esc(raw)}</h1><div class="hits">` + hits.map(h => {
    const s = h.p.text.slice(Math.max(0, h.i - 90), h.i + q.length + 140);
    return `<div class="hit"><a href="#${h.p.id}" onclick="$('#q').value=''">${esc(h.p.title)}</a> <span class="count">(${h.n})</span><div class="snip">…${esc(s)}…</div></div>`;
  }).join("") + `</div>` + (st.length ? `<h2>Store (${st.length})</h2>` + st.slice(0, 60).map(entryHtml).join("") : "")
    + (!hits.length && !st.length ? `<p>Nothing found.</p>` : "");
}
function go() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  side();
  if ($("#q").value.trim()) return search();
  tab === "pages" ? showPage() : tab === "store" ? showStore() : showQuestions();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; go(); });
let t; $("#q").oninput = () => { clearTimeout(t); t = setTimeout(go, 150); };
window.onhashchange = () => { const h = decodeURIComponent(location.hash.slice(1)); if (DATA.pages.some(p => p.id === h)) { page = h; tab = "pages"; $("#q").value = ""; go(); } };
const h0 = decodeURIComponent(location.hash.slice(1));
if (DATA.pages.some(p => p.id === h0)) page = h0; else if (["store", "questions"].includes(h0)) tab = h0;
else if (h0.startsWith("search=")) { tab = "pages"; $("#q").value = h0.slice(7); }
$("#credits").innerHTML = DATA.credits || "";
go();
</script>

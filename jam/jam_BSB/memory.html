const DATA = {"project": "jam/jam_BSB", "pages": [{"id": "index.md", "title": "Jamaican Creole English: wiki", "html": "<h1>Jamaican Creole English: wiki<\/h1>\n<p>What Di Jamiekan Nyuu Testiment (the style corpus) teaches about Jamaican Creole English as written, for drafting the Old Testament from the Hebrew. Drafting agents read it before every chapter; the language team reads it, corrects it and answers the <a href=\"#questions.md\">questions<\/a>. The checked facts are in the store (<code>../profile/observations.json<\/code>, <code>../profile/decisions.json<\/code>); each page shows its store entries in a generated block at the end. The pages are in English; examples are short quotations from the corpus with their references.<\/p>\n<p>Set up on 2026-10-16 from the NT alone (no OT drafts yet), with the derived report's statistics confirmed or rejected against the corpus.<\/p>\n<h2>The five things a drafter must not get wrong<\/h2>\n<ol><li><strong>No English tense.<\/strong> The narrative past is the bare verb; <em>did<\/em> is for states and backgrounds; future is <em>ago<\/em>; progressive <em>a<\/em> (<a href=\"#grammar/verbs.md\">verbs<\/a>).<\/li><li><strong>No English copula.<\/strong> <em>a<\/em> between nouns, nothing before adjectives, <em>de<\/em> for place (<a href=\"#grammar/clauses.md\">clauses<\/a>).<\/li><li><strong>The spelling is phonemic<\/strong>: iina, uol, kindom, faada, ous; never English spelling (<a href=\"#orthography.md\">orthography<\/a>).<\/li><li><strong>Speech is \"X se tu Y se, “…”\"<\/strong>, and negation doubles (<em>neva av no pikni<\/em>) (<a href=\"#grammar/connectors.md\">connectors<\/a>, <a href=\"#grammar/clauses.md\">clauses<\/a>).<\/li><li><strong>Plural <em>dem<\/em> after the noun, <em>unu<\/em> for plural you, <em>shi/ar<\/em> for women<\/strong> (<a href=\"#grammar/nouns-pronouns.md\">nouns and pronouns<\/a>).<\/li><\/ol>\n<h2>Pages<\/h2>\n<ul><li>Grammar: <a href=\"#grammar/verbs.md\">verbs<\/a>, <a href=\"#grammar/clauses.md\">clauses<\/a>, <a href=\"#grammar/nouns-pronouns.md\">nouns and pronouns<\/a>, <a href=\"#grammar/connectors.md\">speech and connectors<\/a><\/li><li><a href=\"#style.md\">Style<\/a>: how the corpus translates<\/li><li><a href=\"#orthography.md\">Orthography<\/a>, <a href=\"#names.md\">names<\/a>, <a href=\"#vocabulary.md\">vocabulary<\/a>, <a href=\"#formulas.md\">formulas<\/a><\/li><li><a href=\"#decisions.md\">The project's decisions<\/a> (proposals until the team decides), <a href=\"#gaps.md\">gaps<\/a>, <a href=\"#questions.md\">questions for the team<\/a><\/li><\/ul>\n<p>Search tools: <code>python3 scripts/concord.py jam/jam_BSB &lt;eng|jam|forms|lex|store&gt; &lt;arg&gt;<\/code>; <code>python3 scripts/lang.py hbo jam/jam_BSB &lt;H-number&gt;<\/code> for a Hebrew word through the LXX.<\/p>\n<h2>Pages<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><a href=\"#decisions.md\">The project's decisions<\/a> — 10 store entries<\/li><li><a href=\"#formulas.md\">Formulas<\/a> — 24 store entries<\/li><li><a href=\"#gaps.md\">Gaps: what the NT has no model for<\/a> — 11 store entries<\/li><li><a href=\"#grammar/clauses.md\">Clauses: order, copula, focus, negation, questions<\/a> — 8 store entries<\/li><li><a href=\"#grammar/connectors.md\">Speech, connectors, prepositions, time<\/a> — 9 store entries<\/li><li><a href=\"#grammar/nouns-pronouns.md\">Nouns, pronouns, possession, numbers<\/a> — 9 store entries<\/li><li><a href=\"#grammar/verbs.md\">Verbs: tense, aspect, mood<\/a> — 11 store entries<\/li><li><a href=\"#names.md\">Names<\/a> — 75 store entries<\/li><li><a href=\"#orthography.md\">Orthography<\/a> — 24 store entries<\/li><li><a href=\"#questions.md\">Questions for the language team<\/a> — 0 store entries<\/li><li><a href=\"#style.md\">Style: how the corpus translates<\/a> — 1 store entries<\/li><li><a href=\"#vocabulary.md\">Vocabulary<\/a> — 128 store entries<\/li><li><a href=\"#inbox.md\">Inbox<\/a> — 0 unplaced entries<\/li><li><a href=\"#log.md\">Log<\/a> — who changed what, newest last &lt;!-- store:end sha=f526dfe8 --&gt;<\/li><\/ul>", "text": "# Jamaican Creole English: wiki What Di Jamiekan Nyuu Testiment (the style corpus) teaches about Jamaican Creole English as written, for drafting the Old Testament from the Hebrew. Drafting agents read it before every chapter; the language team reads it, corrects it and answers the [questions](questions.md). The checked facts are in the store (`../profile/observations.json`, `../profile/decisions.json`); each page shows its store entries in a generated block at the end. The pages are in English; examples are short quotations from the corpus with their references. Set up on 2026-10-16 from the NT alone (no OT drafts yet), with the derived report's statistics confirmed or rejected against the corpus. ## The five things a drafter must not get wrong 1. **No English tense.** The narrative past is the bare verb; *did* is for states and backgrounds; future is *ago*; progressive *a* ([verbs](grammar/verbs.md)). 2. **No English copula.** *a* between nouns, nothing before adjectives, *de* for place ([clauses](grammar/clauses.md)). 3. **The spelling is phonemic**: iina, uol, kindom, faada, ous; never English spelling ([orthography](orthography.md)). 4. **Speech is \"X se tu Y se, “…”\"**, and negation doubles (*neva av no pikni*) ([connectors](grammar/connectors.md), [clauses](grammar/clauses.md)). 5. **Plural *dem* after the noun, *unu* for plural you, *shi/ar* for women** ([nouns and pronouns](grammar/nouns-pronouns.md)). ## Pages - Grammar: [verbs](grammar/verbs.md), [clauses](grammar/clauses.md), [nouns and pronouns](grammar/nouns-pronouns.md), [speech and connectors](grammar/connectors.md) - [Style](style.md): how the corpus translates - [Orthography](orthography.md), [names](names.md), [vocabulary](vocabulary.md), [formulas](formulas.md) - [The project's decisions](decisions.md) (proposals until the team decides), [gaps](gaps.md), [questions for the team](questions.md) Search tools: `python3 scripts/concord.py jam/jam_BSB <eng|jam|forms|lex|store> <arg>`; `python3 scripts/lang.py hbo jam/jam_BSB <H-number>` for a Hebrew word through the LXX. ## Pages <!-- store:begin (generated by scripts/wiki.py sync from profile/; change the store, not this block) --> - [The project's decisions](decisions.md) — 10 store entries - [Formulas](formulas.md) — 24 store entries - [Gaps: what the NT has no model for](gaps.md) — 11 store entries - [Clauses: order, copula, focus, negation, questions](grammar/clauses.md) — 8 store entries - [Speech, connectors, prepositions, time](grammar/connectors.md) — 9 store entries - [Nouns, pronouns, possession, numbers](grammar/nouns-pronouns.md) — 9 store entries - [Verbs: tense, aspect, mood](grammar/verbs.md) — 11 store entries - [Names](names.md) — 75 store entries - [Orthography](orthography.md) — 24 store entries - [Questions for the language team](questions.md) — 0 store entries - [Style: how the corpus translates](style.md) — 1 store entries - [Vocabulary](vocabulary.md) — 128 store entries - [Inbox](inbox.md) — 0 unplaced entries - [Log](log.md) — who changed what, newest last <!-- store:end sha=f526dfe8 --> "}, {"id": "decisions.md", "title": "The project's decisions", "html": "<h1>The project's decisions<\/h1>\n<p>The project has no style guide or review overview yet, so nothing here is decided by the team. The entries are <strong>proposals<\/strong> (<code>project-decision<\/code>, status open) built on how the NT renders the same words in its OT quotations; drafting agents use them until the team answers the <a href=\"#questions.md\">questions<\/a>.<\/p>\n<h2>Divine names<\/h2>\n<div class=\"table-wrap\"><table><tr><th>Hebrew<\/th><th>proposal<\/th><th>model<\/th><\/tr><tr><td>אֱלֹהִים (God)<\/td><td><strong>Gad<\/strong><\/td><td>3,763×; lower case <em>gad<\/em> for false gods (faalz gad)<\/td><\/tr><tr><td>יְהוָה (the LORD)<\/td><td><strong>di Laad<\/strong><\/td><td>MAT 4:7, MRK 12:29, HEB 8:8: κύριος in quotations<\/td><\/tr><tr><td>יְהוָה אֱלֹהִים (the LORD God)<\/td><td><strong>di Laad Gad<\/strong><\/td><td>REV 1:8, ACT 3:20 (14×)<\/td><\/tr><tr><td>the LORD your God<\/td><td><strong>di Laad we a yu Gad<\/strong><\/td><td>MAT 4:7, MRK 12:30 (relative clause)<\/td><\/tr><tr><td>God Most High<\/td><td><strong>di Muos Ai Gad<\/strong><\/td><td>LUK 1:32, HEB 7:1<\/td><\/tr><tr><td>El Shaddai, LORD of Hosts<\/td><td><strong>di Laad we av aal a di powa<\/strong><\/td><td>ROM 9:29; JAS 5:4 has \"di Laad we ruul uova evriting\"<\/td><\/tr><tr><td>the Spirit of God<\/td><td><strong>Gad Spirit<\/strong><\/td><td>39×<\/td><\/tr><\/table><\/div>\n<p>Small capitals cannot be shown; <em>di Laad<\/em> serves both for YHWH and for אֲדֹנָי addressed to God, as in the NT. Where Hebrew has אֲדֹנָי יְהוִה, propose <em>Laad Gad<\/em> (by rule).<\/p>\n<h2>Words with no settled rendering<\/h2>\n<ul><li><strong>covenant<\/strong> (בְּרִית): pramis 35%, plan 30%, diil 11%. <em>pramis<\/em> also means promise and oath; the covenant of Genesis 9, 15, 17 may need its own word.<\/li><li><strong>חֶסֶד<\/strong> (loving devotion): via ἔλεος the corpus has <em>kain<\/em> (51%), often \"gud an kain tu\" (MAT 23:23, GAL 6:16).<\/li><li><strong>glory<\/strong>: brait 17%, priez 17%, big 16%, lait 11%: no single word. Shining glory = <em>brait lait<\/em> (ACT 7:2); honour = <em>priez<\/em>, <em>rispek<\/em>.<\/li><\/ul>\n<h2>Numbers and measures<\/h2>\n<p>Numbers are written in words (the corpus has 14 digit tokens). Measures: REV 21:17 converts cubits into feet; whether the OT does the same is a question for the team.<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>term:god<\/code><\/strong> H430 → <strong>Gad<\/strong> [high, observed, attested]<ul><li>NT: MAT 4:7 <em>Gad<\/em><\/li><li>answers: god<\/li><li>Gad 3,763×; lexicon god → gad 87%. Gad is also the tribe Gad (REV 7:5): see questions.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>term:yhwh<\/code><\/strong> H3068 → <strong>di Laad<\/strong> [medium, open, attested]<ul><li>NT: MAT 4:7 <em>di Laad<\/em><\/li><li>answers: lord<\/li><li>Proposal: the LORD (YHWH) = di Laad, as the NT renders κύριος in OT quotations (MAT 4:7, MRK 12:29, HEB 8:8 \"di Laad se\"). project.yaml asks the team to decide the divine names.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>term:lord_god<\/code><\/strong> H3068 H430 → <strong>di Laad Gad<\/strong> [medium, open, attested]<ul><li>NT: REV 1:8 <em>Di Laad Gad<\/em><\/li><li>answers: lord god<\/li><li>YHWH Elohim (GEN 2:4 onwards) = di Laad Gad, as in REV 1:8, ACT 3:20 (14×).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>term:the_lord_your_god<\/code><\/strong> H3068 H430 + suffix → <strong>di Laad we a yu Gad<\/strong> [high, observed, attested]<ul><li>NT: MAT 4:7 <em>we a yu Gad<\/em><\/li><li>answers: lord your god<\/li><li>\"the LORD your God\" is a relative construction: di Laad we a yu/unu/fi wi Gad (6× in quotations; MRK 12:29 \"di Laad we a fi wi Gad\").<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>term:most_high<\/code><\/strong> H5945 → <strong>di Muos Ai Gad<\/strong> [high, observed, attested]<ul><li>NT: LUK 1:32 <em>di Muos Ai Gad<\/em><\/li><li>answers: most high<\/li><li>God Most High (GEN 14:18–22) = di Muos Ai Gad (LUK 1:32, HEB 7:1).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>term:almighty<\/code><\/strong> H7706 H6635 → <strong>di Laad we av aal a di powa<\/strong> [medium, open, attested]<ul><li>NT: ROM 9:29 <em>aal a di powa<\/em><\/li><li>answers: almighty, lord of hosts<\/li><li>El Shaddai (GEN 17:1) and the Lord of Hosts have no single form; all are relative clauses about power (REV 1:8 \"di wan we av aal a di powa\").<\ y are proposals for the team, reused verbatim wherever the Hebrew repeats them:<\/p>\n<div class=\"table-wrap\"><table><tr><th>Hebrew / BSB<\/th><th>draft<\/th><th>built from<\/th><\/tr><tr><td>And it was so<\/td><td><em>An a so it apm.<\/em><\/td><td>focus <em>a<\/em> + <em>so<\/em>; \"So it apm\" (JAS 2:23)<\/td><\/tr><tr><td>And there was evening, and there was morning: the Nth day<\/td><td><em>Iivnin kom, an maanin kom: dat a did di N die.<\/em><\/td><td>\"Wen iivnin kom\" (MAT 8:16); past copula <em>a did<\/em><\/td><\/tr><tr><td>God called X \"Y\"<\/td><td><em>Gad kaal X “Y”<\/em>; a fronted object stays first: <em>an di daak im kaal “Nait”<\/em><\/td><td><\/td><\/tr><tr><td>according to its kind<\/td><td><em>difrant difrant kaina<\/em><\/td><td>1CO 15:38<\/td><\/tr><tr><td>in our image, after our likeness<\/td><td><em>fi luk laik wi, fi bi laik wi<\/em><\/td><td>REV 15:2<\/td><\/tr><tr><td>Be fruitful and multiply<\/td><td><em>Unu av nof nof pikni<\/em><\/td><td>the gap proposal<\/td><\/tr><\/table><\/div>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>formula:said_to<\/code><\/strong> וַיֹּאמֶר אֶל / he said to &lt;X&gt; → <strong>&lt;speaker&gt; se tu &lt;X&gt; se, “…”<\/strong> [high, observed, attested]<ul><li>NT: LUK 15:7 <em>se tu dem se<\/em><\/li><li>answers: said to, said<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>formula:answered<\/code><\/strong> וַיַּעַן … וַיֹּאמֶר / answered → <strong>&lt;speaker&gt; ansa &lt;X&gt; se, “…”<\/strong> [high, observed, attested]<ul><li>NT: MAT 4:7 <em>ansa im se<\/em><\/li><li>answers: answered, replied<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>formula:asked<\/code><\/strong> asked → <strong>&lt;speaker&gt; aks &lt;X&gt; se, “…”<\/strong> [high, observed, attested]<ul><li>NT: ACT 2:12 <em>aks dem wan aneda<\/em><\/li><li>answers: asked<\/li><li>agent oposal; the drafts' notes should say what they chose, and the next agent records it here.<\/p>\n<p>The corpus's own way with missing concepts is to <strong>explain<\/strong>: the birthright is \"everything Esau would get as his father's first son\" (HEB 12:16), the tithe is \"wan outa evri ten\" (HEB 7:4), cubits become feet (REV 21:17). Follow that style rather than coining nouns.<\/p>\n<h2>Genesis 1–3<\/h2>\n<p>Genesis 1 is drafted (2026-10-16); its choices replace the first proposals here (the old gap entries are superseded, the new ones are open decisions for the team):<\/p>\n<ul><li><strong>expanse<\/strong> (GEN 1:6): <em>wan big ruuf<\/em>, then <em>di skai ruuf<\/em> (<em>ruuf<\/em> 7× in the corpus); footnote <em>wan big kova<\/em>.<\/li><li><strong>formless and void<\/strong> (GEN 1:2): <em>neva av no shiep, an it did emti<\/em>.<\/li><li><strong>according to their kinds<\/strong>: <em>difrant difrant kaina<\/em> (1CO 15:38).<\/li><li><strong>be fruitful and multiply<\/strong>: <em>Unu av nof nof pikni<\/em> (for the animals in 1:22 too; birds <em>ton nof nof<\/em>).<\/li><li><strong>creeping things / livestock / wild animals<\/strong>: <em>animal we kraal pan di grong<\/em> / <em>animal we piipl kip<\/em> / <em>wail animal<\/em>, the classes of JAS 3:7.<\/li><li><strong>great sea creatures<\/strong>: <em>big big animal iina di sii<\/em>.<\/li><li><strong>image and likeness<\/strong>: <em>fi luk laik wi, fi bi laik wi<\/em>.<\/li><li><strong>bring forth<\/strong> (of the earth): no model; <em>Mek di ort bier …<\/em> for plants, <em>Mek … kom out a di ort<\/em> for animals.<\/li><li>Still open from Genesis 2–3: garden of Eden, the tree of the knowledge of good and evil, cherubim.<\/li><\/ul>\n<h2>Later in Genesis<\/h2>\n<p>ark (<em>aak<\/em>, LUK 17:27, or <em>big buot<\/em>, HEB 11:7), cubits, birthright, tithe, concubine, tent, sojourning (<em>liv laik chrienja<\/em>, ACT 7:6), flocks and herds, the peoples of Canaan (Hittites, Hivites, Perizzites).<\/p>\ pening quote mark 1,472×. Hebrew וַיֹּאמֶר … לֵאמֹר fits this exactly: the first verb is <em>se<\/em>, לֵאמֹר is the second <em>se<\/em>.<\/p>\n<p>Quotation marks: “ ” for speech, ‘ ’ inside, “ ” again at the third level (MAT 22:44).<\/p>\n<h2>Connectors<\/h2>\n<div class=\"table-wrap\"><table><tr><th>BSB / Greek<\/th><th>corpus<\/th><th>figures<\/th><\/tr><tr><td>and<\/td><td><strong>An<\/strong>, or nothing<\/td><td>καί: an 50%, none 37% at clause start<\/td><\/tr><tr><td>then<\/td><td><strong>Den<\/strong><\/td><td>τότε: den 65%<\/td><\/tr><tr><td>so, therefore<\/td><td><strong>So<\/strong><\/td><td>οὖν: so 43%, den 18%<\/td><\/tr><tr><td>but<\/td><td><strong>Bot<\/strong><\/td><td>δέ: bot 39%, none 52%<\/td><\/tr><tr><td>now (new scene)<\/td><td><strong>Nou<\/strong><\/td><td>\"Nou yu did av wan man\" (ACT 5:1)<\/td><\/tr><tr><td>when<\/td><td><strong>Wen<\/strong><\/td><td>618 sentences open with it<\/td><\/tr><tr><td>after that<\/td><td><strong>Afta dat<\/strong><\/td><td>85× (LUK 1:24)<\/td><\/tr><tr><td>because, for<\/td><td><strong>kaaz<\/strong>, kaa; <em>sieka<\/em> + noun<\/td><td>γάρ: kaaz 56%<\/td><\/tr><tr><td>if<\/td><td><strong>ef<\/strong> (no <em>if<\/em>)<\/td><td>936×<\/td><\/tr><tr><td>so that, to<\/td><td><strong>so (dat)<\/strong>, <strong>fi<\/strong><\/td><td>ἵνα: so 27%, fi 25%<\/td><\/tr><\/table><\/div>\n<p>Sentence-initial words: An 1,037, So 934, Bot 893, Wen 618, Den 436, Nou 258. In Hebrew narrative (inferred from these figures, not from an OT text): do not open every clause with <em>An<\/em>; join two or three actions with <em>an<\/em> and start a new sentence with <em>So<\/em>, <em>Den<\/em> or <em>Wen<\/em>.<\/p>\n<h2>Prepositions<\/h2>\n<p><strong>iina<\/strong> (in, into; 3,060×), <strong>a<\/strong> (at, to a place: \"go a yu yaad\", LUK 15:6), <strong>pan<\/strong> (on), wid, fram, tu (to a person), outa, bout, uova, anda, <strong>infronta<\/strong> (before, in the presence of), mongks (among), gens (against), saida (beside). The priors' <em>ina<\/em>, <em>ova<\/em> are absent: write <em>iina<\/em>, <em>uova<\/em>.<\/p>\n<h2>Time<\/h2>\n<p>\"Wen taim did staat\" (In the beginning, JHN 1:1); \"fram Gad mek di worl\" (from the creation, MAT 19:4); \"wen it kech iivnin\" (MRK 4:35); <em>wan die<\/em>, <em>di neks die<\/em>, <em>afta dat<\/em>. \"Die an nait\" (REV 4:8).<\/p>\n<h2>Attention words<\/h2>\n<p>Behold: \"Luk ya\" (22×), \"wach ya nou\" (MAT 1:20), \"Lisn op!\" (MAT 1:23), \"Wach it\" (HEB 8:8). Hebrew הִנֵּה is much more frequent than these: leave it out in narrative, use one of them in speech. \"Matarafak\" = in fact (JHN 1:1).<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>speech_frame<\/code><\/strong> <strong>Speech is framed \"&lt;speaker&gt; se (tu &lt;addressee&gt;) se, “…”\": the verb se (say) and then the complementizer se again. Also aks &lt;X&gt; se, ansa (&lt;X&gt;) se, tel &lt;X&gt; se.<\/strong> [high, observed] — <code>&lt;speaker&gt; se tu &lt;addressee&gt; se, “&lt;quote&gt;”<\/code><ul><li>NT: LUK 15:7 <em>se tu dem se<\/em>; MAT 4:7 <em>Jiizas ansa im se<\/em>; LUK 15:12 <em>tu im faada se<\/em>; ACT 7:2 <em>ansa an se<\/em><\/li><li>\"se tu X se\" 355× (+ 22 with a two-word addressee); \"se,\" before an opening quote mark 1472×; aks X se 118×; ansa (X) se 83×. Derived report: καί λέγω αὐτός = \"an se\" (13 of 162). Counter-cases: the frame may also follow or be left out (Jiizas ansa bak, “…”, MAT 4:10).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>quotation_marks<\/code><\/strong> <strong>Double curly quotes “…” for speech, single ‘…’ for speech inside speech.<\/strong> [high, observed]<ul><li>NT: LUK 15:6 <em>‘Kom selibriet<\/em>; MAT 22:44 <em>Di Laad se<\/em><\/li><li>project.yaml quotes: “”. A quotation inside a quotation uses ‘ ’ (LUK 15:6), a third level “ ” again (MAT 22:44).<\/li><li>agent:memory-setup, 2026-10-16<\/ r><td>those<\/td><td><strong>dem N de<\/strong><\/td><td>\"dem sitn de\" (HEB 10:6)<\/td><\/tr><tr><td>here / there<\/td><td>ya-so / de-so<\/td><td><\/td><\/tr><\/table><\/div>\n<h2>Pronouns<\/h2>\n<div class=\"table-wrap\"><table><tr><th><\/th><th>sg<\/th><th>pl<\/th><\/tr><tr><td>1<\/td><td>mi<\/td><td>wi<\/td><\/tr><tr><td>2<\/td><td>yu<\/td><td><strong>unu<\/strong><\/td><\/tr><tr><td>3<\/td><td>im (he, him, his, it), <strong>shi / ar<\/strong> (she / her), it<\/td><td>dem<\/td><\/tr><\/table><\/div>\n<p>One form for subject, object and possessor. Women are <em>shi/ar<\/em>: in verses where the BSB has only she/her, shi 161, ar 145, im 32 (MRK 5:29 \"shi fiil iina ar badi\"). <em>ar<\/em> also means \"or\". <strong>unu<\/strong> is strictly plural: decide singular <em>yu<\/em> or plural <em>unu<\/em> from the Hebrew, not from English \"you\". Reflexive: <em>imself<\/em>, <em>unuself<\/em>.<\/p>\n<h2>Possession<\/h2>\n<p>The possessor comes first, with nothing between: \"Lat waif\" (LUK 17:32), \"Gad kindom\" (35× for the kingdom of God). Emphatic or predicative: <strong>fi<\/strong> + possessor, written apart: \"fi mi Laad\" (MAT 22:44), \"a fi dem\". A few fixed phrases link with <em>a<\/em>: \"Spirit a di Laad\" (LUK 4:18), \"di King a Iijip\" (ACT 7:10). Contracted <em>fi'im<\/em> (67×) and <em>fu'unu<\/em> (54×) occur in some books; the full forms are safer.<\/p>\n<h2>Doubling<\/h2>\n<p>A doubled word intensifies: \"big big shiit\" (ACT 10:11), \"nof nof\" (1CO 2:6); makes a distributive: \"difrant difrant siid\" (1CO 15:38); or an iterative: \"kot op kot op\" (ACT 19:16). Fixed doubles: <strong>faada faada<\/strong> (forefathers, 61×; 2PE 3:4), <em>pikni pikni<\/em> (grandchildren). Hebrew \"very\" can be a doubled adjective (<em>gud gud<\/em>) or <em>riili<\/em>.<\/p>\n<h2>Comparison<\/h2>\n<p><em>beta<\/em>, <em>biga<\/em>, <em>iiziya<\/em> + <strong>dan<\/strong> (\"iiziya dan\", MAT 10:15); otherwise <em>muo<\/em> + adjective + <em>dan<\/em>. Superlative <em>di muos<\/em> (\"Di muos impuotant\", MRK 12:29) or <em>-is<\/em> in a few words (liklis). The derived report counted dan ×59, muo ×29, biga ×20, beta ×14 for Greek comparatives.<\/p>\n<h2>Numbers<\/h2>\n<p>Written as words: wan, tuu, chrii, fuo, faiv, siks, sevn, iet, nain, ten, twelv, onjrid, touzn; \"nainti-nain\" (LUK 15:4), \"fuo onjrid ier\" (ACT 7:6), \"twelv touzn\" (REV 7:5). Digits are rare (14 tokens). Ordinals: fos, sekan; \"die sevn\" (HEB 4:4, number after the noun) beside \"di sevn die\". Genesis 5 and 11 ages: write the numbers in words.<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>article<\/code><\/strong> <strong>Definite article di; indefinite wan (also \"one\"); bare nouns for generic or mass reference.<\/strong> [high, observed]<ul><li>NT: LUK 15:4 <em>di nainti-nain<\/em>; ACT 5:1 <em>wan man<\/em>; LUK 15:1 <em>Di taks kalekta<\/em><\/li><li>di 11129×, wan 3356× (with \"one\" and \"wan aneda\"). Derived report: Greek article ὁ = di 45%, none 43%. Priors: wahn ABSENT. Names and Gad take no article; \"di Laad\" does.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>plural<\/code><\/strong> <strong>Plural is a separate word \"dem\" after the noun phrase (di piipl dem, im falara dem); it is left out after numerals and quantifiers and with generic nouns.<\/strong> [high, observed] — <code>(di) &lt;noun&gt; dem<\/code><ul><li>NT: LUK 15:1 <em>di sina dem<\/em>; LUK 15:6 <em>fren an nieba dem<\/em>; ACT 7:8 <em>twelv bwai pikini dem<\/em>; GAL 4:22 <em>tuu bwai pikni<\/em><\/li><li>\"di N dem\" 2147×; piipl dem 859×. Counter-cases: tuu bwai pikni (GAL 4:22) with a numeral and no dem, beside twelv … pikini dem (ACT 7:8). One dem covers a coordinated phrase (fren an nieba dem). Never an -s plural on native words (tingz, ada a fixed form). Priors' \"-dem as suffix\": not a suffix, written apart.<\/li><li>agent:mem will) is done here with small words <strong>before<\/strong> the verb, or with nothing at all. The commonest error of a drafter who knows English is to reach for English tense: there is no <em>-ed<\/em>, no <em>was<\/em>, no <em>will<\/em>.<\/p>\n<h2>The past in a story: the bare verb<\/h2>\n<p>The main line of a narrative uses the bare verb: \"Jiizas ben dong an staat rait\" (JHN 8:6), \"Shi rap im op\" (LUK 2:7), \"lef im konchri\" (ACT 7:4). Hebrew wayyiqtol chains become bare verbs joined by <em>an<\/em> or started anew with <em>So<\/em>, <em>Den<\/em>, <em>Wen<\/em> (see <a href=\"#grammar/connectors.md\">connectors<\/a>).<\/p>\n<p>The derived report proposed verb endings (-v present, -k imperative, -t passive …) from word-final letters. They are an artefact of an isolating language and are <strong>rejected<\/strong>: there are no verb endings.<\/p>\n<h2>did: past of states and backgrounds<\/h2>\n<p><em>did<\/em> (3,513×) is not the narrative past. It marks:<\/p>\n<ul><li>a past <strong>state<\/strong>: did de (was there, 225×), did av (had, 170×), did waahn (wanted), did wel uol (LUK 1:7);<\/li><li>a <strong>background or earlier<\/strong> event, a pluperfect: \"Iebriyam did bai da piis a lan de\" (ACT 7:16, the purchase long before the burial);<\/li><li>the <strong>past copula<\/strong> with <em>a<\/em>: \"Iebriyam did a Aizak faada\" (MAT 1:2), \"Aizak a did Iebriyam pikni\" (LUK 3:34).<\/li><\/ul>\n<p><em>did a<\/em> + verb is the past progressive: \"mi did a chrimbl\" (1CO 2:3), \"Piipl did a nyam, jringk\" (LUK 17:27). Read <em>did a<\/em> by what follows: a verb = progressive, a noun = copula.<\/p>\n<h2>Present, progressive, future, completive<\/h2>\n<ul><li><strong>a<\/strong> + verb: ongoing or habitual: \"Mi a tel unu\" (LUK 15:7), \"Mi a fala Paal\" (1CO 1:12). A plain state is the bare verb: <em>mi nuo<\/em>, <em>im lov<\/em>.<\/li><li><strong>ago<\/strong> (1,573×), <strong>gweehn<\/strong> (119×), <strong>wi<\/strong> + verb: future. \"Mi ago shuo\" (1CO 1:19), \"Gad gweehn siev\" (1TI 2:15), \"Mi wi bi unu faada\" (2CO 6:18). Negative: <strong>naa go<\/strong> (307×).<\/li><li><strong>don<\/strong> + verb: already done (1CO 1:7 \"don gi unu\"). Rare; most English perfects are bare verbs.<\/li><\/ul>\n<h2>Modals<\/h2>\n<p>kyan (can) / kyaahn (can't), kuda / kudn, wuda / wudn, shuda, mos, <strong>afi<\/strong> (have to, 286×), maita (might). After a subject, <strong>fi<\/strong> = should: the Law's commandments in the NT are \"Yu fi lov di Laad\" (MRK 12:30), \"Yu fi worship\" (MAT 4:10). Use <em>Yu fi<\/em> for Hebrew commands in the Law; plain imperatives for direct orders.<\/p>\n<h2>Let us, let there be: mek<\/h2>\n<ul><li>\"let us\" = <strong>Mek wi<\/strong> + verb: 32 of the 52 BSB \"let us\" verses (MRK 1:38 \"Mek wi go\"; 1JN 4:7); 10 more start with <em>Kom<\/em> (Kom mek …, JHN 11:16). The derived report's \"nothing\" for the 1st plural subjunctive was wrong.<\/li><li>God's jussives in Genesis 1 (\"Let there be light\") have their model in 2CO 4:6, God's own word quoted: \"Mek di lait shain\". Build <em>Mek<\/em> + subject + verb: <em>Mek lait de<\/em> (by rule).<\/li><li><em>mek<\/em> is also the causative: \"mek wi kyan nuo Gad\" (enabled us to know God, 1CO 1:30).<\/li><\/ul>\n<h2>Prohibitive<\/h2>\n<p>\"No\" + verb: \"No fried!\" (LUK 1:13, 38×), \"No tes di Laad\" (MAT 4:7); \"no bada\" + verb (don't bother to, ROM 12:19).<\/p>\n<h2>Serial verbs<\/h2>\n<p>Verbs follow each other without <em>and<\/em> or <em>to<\/em>: \"go a Betliyem go si\" (LUK 2:15), \"kom kil it\" (LUK 15:23), \"kom kom tel\" (came to tell, 1PE 1:12). <em>gi<\/em> after an object means \"to/for\": \"bon … sakrifais gi Gad\" (HEB 11:4).<\/p>\n<h2>Passive<\/h2>\n<p>There is none. Use (1) <strong>get<\/strong> + verb: \"get siev\" (1CO 10:33), \"get baptaiz\" (1CO 1:15); (2) the patient as subject of the bare verb: \"Adam did mek bifuo Iiv\" (Adam was formed first, 1TI 2:13); or (3) impersonal <em>dem<\/em>: \"di giet we dem kaal…\" (ACT 3:2). Hebrew Niphal \"was called\" = <em>dem kaal<\/em> or <em>we niem<\/em>.<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>narrative_tense<\/code><\/strong> <strong>Past events in narrative are told with the bare verb: no preterite ending, no past marker. \"did\" is not the narrative past.<\/strong> [high, observed] — <code>&lt;subject&gt; &lt;bare verb&gt; … an &lt;bare verb&gt; …<\/code><ul><li>NT: JHN 8:6 <em>Jiizas ben dong<\/em>; JHN 20:5 <em>ben dong an luk<\/em>; LUK 2:7 <em>shi av ar<\/em>; ACT 7:4 <em>lef im konchri<\/em><\/li><li>Narrative verbs carry no ending: ben, luk, rap, put, lef, go, kom. The derived report's ending hypotheses (-v, -k, -t, -ch … with Greek tense) are artefacts of word-final letters in an uninflected language and are rejected. Counter-cases: \"did\" + verb (3513× in all) marks a state or a background/anterior event (see past_did); the bare verb is the default for a sequence of events.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>past_did<\/code><\/strong> <strong>\"did\" before a verb or predicate marks the past of a state or a background/earlier event (had, was, had done), not the main line of a story.<\/strong> [high, observed] — <code>&lt;subject&gt; did &lt;verb|de|av|a&gt;<\/code><ul><li>NT: LUK 3:34 <em>a did<\/em>; JHN 1:1 <em>did de bout<\/em>; GAL 4:22 <em>Iebriyam did av<\/em>; ACT 7:16 <em>did bai<\/em><\/li><li>Most frequent continuations of did: a (702), de (225), av (170), mek, waahn, se, kom. \"did de\" = was (somewhere), \"did av\" = had, \"did waahn\" = wanted. Used in backgrounds (\"Iebriyam did bai da piis a lan\", the purchase before the burial) and pluperfects.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>past_progressive<\/code><\/strong> <strong>\"did a\" + verb = was doing (past ongoing); the same string \"did a\" + noun is the past : go + verb (go tel), kom + verb (kom kom tel = came to tell), tek X go/kom (take X to), gi = to/for after an object (bon sakrifais gi Gad).** [high, observed] - NT: LUK 15:23 *kom kil it*; HEB 11:4 *sakrifais gi Gad*; LUK 2:15 *Betliyem go si*; 1PE 1:12 *kom kom tel* - go a 278×, kom bak 331×, kom fram 257×; \"kom kom\" (came to …) 52×. - agent:memory-setup, 2026-10-16 - **`passive`** **No passive morphology. A passive is rendered (1) with get + verb (get siev, get baptaiz), (2) with the bare verb and the patient as subject (di evn an di ort did mek), or (3) with impersonal \"dem\" as subject (dem kaal …).** [high, observed] - NT: 1CO 10:33 *get siev*; 1CO 1:15 *get baptaiz*; 2PE 3:5 *did mek jos so*; ACT 3:2 *we dem kaal* - get + verb in total 1229× (get also = receive, become). \"we dem kaal\" (called, named) 35×; \"we niem\" 37×. 1TI 2:13 \"Adam did mek bifuo Iiv\" (Adam was formed first). - agent:memory-setup, 2026-10-16 <!-- store:end sha=0860f260 --> "}, {"id": "names.md", "title": "Names", "html": "<h1>Names<\/h1>\n<h2>How the corpus spells names<\/h2>\n<p>Names are spelt as a Jamaican speaker pronounces the <strong>English<\/strong> form, in the spelling of the <a href=\"#orthography.md\">orthography<\/a> page: not from the Greek or Hebrew. The derived report's Greek → target letter pairs (e → ii, a → ie, o → uo) confirm it: they are English vowel sounds.<\/p>\n<div class=\"table-wrap\"><table><tr><th>English<\/th><th>rule<\/th><th>examples<\/th><\/tr><tr><td>stressed long a<\/td><td>ie<\/td><td>Iebl (Abel), Kien (Cain), Siera (Sarah), Iebriyam<\/td><\/tr><tr><td>long e<\/td><td>ii<\/td><td>Iiv (Eve), Iinok (Enoch), Iisaa (Esau)<\/td><\/tr><tr><td>long o<\/td><td>uo<\/td><td>Muoziz (Moses), Juozif (Joseph)<\/td><\/tr><tr><td>long i<\/td><td>ai<\/td><td>Aizak (Isaac), Sainai, Liivai (Levi)<\/td><\/tr><tr><td>au, aw<\/td><td>aa<\/td><td>Paal (Paul)<\/td><\/tr><tr><td>initial h<\/td><td>dropped<\/td><td>Iegar (Hagar), Iemuor (Hamor), Ieran (Haran)<\/td><\/tr><tr><td>h between vowels<\/td><td>y / w<\/td><td>Iebriyam (Abraham), Nowa (Noah), Nieyar (Nahor)<\/td><\/tr><tr><td>final -ah<\/td><td>-a<\/td><td>Juuda, Siera, Tera, Metyuuzila<\/td><\/tr><tr><td>ph, ch (k), th<\/td><td>f, k, t<\/td><td>Fiera (Pharaoh), Melkizedek, Set (Seth)<\/td><\/tr><tr><td>-s / -ses (voiced)<\/td><td>z<\/td><td>Muoziz, Jiemz<\/td><\/tr><\/table><\/div>\n<p>Genesis names the NT has are in the store as attested (Adam, Iiv, Kien, Iebl, Set, Iinos, Iinok, Lamek, Metyuuzila, Nowa, Shem, Tera, Iebriyam, Siera, Lat, Aizak, Ribeka, Jiekob, Iisaa, Riechel, Juozif and the twelve sons, Iijip, Fiera, Kienan, Sadam, Gomaro, Melkizedek, Sielem, Shekem, Ieran).<\/p>\n<h2>Built by rule (open)<\/h2>\n<p>Names the NT lacks were built by the table and are <code>by-rule<\/code>, status open, for the team: Iebram (Abram), Sierai (Sarai), Ishmiel, Liiya (Leah), Lieban (Laban), Iidn (Eden), Am (Ham), Jiefet (Japheth), Biebl (Babel), Nimrad, Iifriyim (Ephraim), Daina (Dinah), Or (Ur), Betel (Bethel).<\/p>\n<h2>Homographs to watch<\/h2>\n<ul><li><strong>Gad<\/strong> is God and also the tribe and son of Jacob (REV 7:5 \"fram Gad chraib\"). Genesis 30:11 and 49:19 need a decision (see <a href=\"#questions.md\">questions<\/a>).<\/li><li><strong>Kienan<\/strong> is Canaan (ACT 7:11) and Cainan (LUK 3:36–37).<\/li><li><strong>Ieran<\/strong> is Haran (ACT 7:4) and Aaron (lexicon).<\/li><li><strong>Am<\/strong> (Ham, by rule) is also a common word in English-based speech; check with the team.<\/li><\/ul>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>letter:names<\/code><\/strong> <strong>New names are spelled as an English speaker pronounces the English form, in the same phonemic spelling: stressed long a → ie (Iebl, Kien, Siera), long e → ii (Iinok, Iiv), long o → uo (Muoziz, Juozif), long i → ai (Aizak, Aizaiya), au/aw → aa (Paal), ph → f, ch (k) → k, th → t, s between vowels and final -s → z.<\/strong> [high, observed]<ul><li>NT: HEB 11:4 <em>Iebl<\/em>; HEB 11:5 <em>Iinok<\/em>; LUK 3:34 <em>Aizak<\/em>; LUK 3:38 <em>Set<\/em><\/li><li>Derived report (Greek → target letters) is dominated by English-sound effects (e → ii, a → ie, o → uu/uo) and confirms that names go through English, not Greek. h between vowels becomes y or w (Iebriyam, Nowa, Rieyab), final -ah is -a (Juuda, Siera). Initial h drops (Iegar, Iemuor, Ieran = Haran).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:adam<\/code><\/strong> Adam → <strong>Adam<\/strong> [high, observed, attested]<ul><li>NT: 1TI 2:13 <em>Adam<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:eve<\/code><\/strong> Eve → <strong>Iiv<\/strong> [high, observed, attested]<ul><li>NT: 1TI 2:13 <em>Iiv<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:cain<\/code><\/strong> Cain → <strong>Kien<\/strong> [high, observed, attested]<ul><li>NT: HEB 11:4 <em>Kien<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:abel<\/code><\/strong> Abel → <strong>Iebl<\/strong> [high, observed, attested]<ul><li>NT: HEB 11:4 <em>Iebl<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:seth<\/code><\/strong> Seth → <strong>Set<\/strong> [high, observed, attested]<ul><li>NT: LUK 3:38 <em>Set<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:enosh<\/code><\/strong> Enosh → <strong>Iinos<\/strong> [high, observed, attested]<ul><li>NT: LUK 3:38 <em>Iinos<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:enoch<\/code><\/strong> Enoch → <strong>Iinok<\/strong> [high, observed, attested]<ul><li>NT: HEB 11:5 <em>Iinok<\/em><\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>name:methuselah<\/code><\/strong> Methuselah → <strong>Metyuuzila<\/strong> [high, obse les<\/th><\/tr><tr><td>long a (father, law)<\/td><td><strong>aa<\/strong><\/td><td>faada, laad, aal, taak, staat<\/td><\/tr><tr><td>long e (see, sea)<\/td><td><strong>ii<\/strong><\/td><td>piipl, iina, siid, priis<\/td><\/tr><tr><td>long u (food, true)<\/td><td><strong>uu<\/strong><\/td><td>fuud, juu, nyuu, chuu<\/td><\/tr><tr><td>ay (face, name)<\/td><td><strong>ie<\/strong><\/td><td>fies, niem, siem, die, prie<\/td><\/tr><tr><td>o (go, show)<\/td><td><strong>uo<\/strong><\/td><td>nuo, shuo, uol, uova, bifuo<\/td><\/tr><tr><td>i (time)<\/td><td><strong>ai<\/strong><\/td><td>taim, laik, Krais<\/td><\/tr><tr><td>ou (house)<\/td><td><strong>ou<\/strong><\/td><td>ous, out, toun, roun<\/td><\/tr><tr><td>short o (God, Lot)<\/td><td><strong>a<\/strong><\/td><td>Gad, Lat, rang (wrong), lang (long)<\/td><\/tr><tr><td>short u (love, come)<\/td><td><strong>o<\/strong><\/td><td>lov, blod, kom, son (sun and son alike)<\/td><\/tr><tr><td>ur/er/ir (church, serve)<\/td><td><strong>o / or<\/strong><\/td><td>choch, sorv, worl, dizorv<\/td><\/tr><tr><td>final -er (father)<\/td><td><strong>a<\/strong><\/td><td>faada, mada, breda, afta, neva<\/td><\/tr><tr><td>-ear/-air (hear, care)<\/td><td><strong>ier<\/strong><\/td><td>ier, kier, shier, nier<\/td><\/tr><\/table><\/div>\n<p><em>ee<\/em> and <em>oo<\/em> do not occur, except <em>ee<\/em> before the nasal <em>hn<\/em> (neehn, gweehn).<\/p>\n<h2>Consonants<\/h2>\n<ul><li><strong>No h<\/strong> from English: ous, im, ier (hear/year/here), api, Ai (high). <em>h<\/em> occurs only in sh, ch, zh and in the nasal <em>-hn<\/em>.<\/li><li><strong>No c, q, x, th<\/strong>: k, kw, ks; th → t or d (ting, di, dat, Set for Seth).<\/li><li><strong>Nasal vowels<\/strong> are written <strong>hn<\/strong>: waahn (want), kyaahn (cannot), neehn, gweehn. <em>kyan<\/em> = can, <em>kyaahn<\/em> = cannot: the <em>hn<\/em> carries the negation.<\/li><li><strong>Palatals<\/strong>: <em>ky<\/em>, <em>gy<\/em> before <em>a<\/em> (kyan, kyari, gyal, gyaadn, Gyalalii), <em>ny<\/em> (nyam, nyuu). Not in every k/g + a: Gad, kaal, gaan have none.<\/li><li><strong>tr/thr → chr, dr → jr<\/strong>: chrii (three, tree), chrang, jriim, jringk; <em>chuu<\/em> = through and true.<\/li><li><strong>Clusters<\/strong> lose their last consonant: lan, fiil, fren, ges; voiced -s is <em>z<\/em> (kaaz, Muoziz, tingz).<\/li><li><strong>Syllabic l, n<\/strong> without a vowel: likl, onggl (only), gyaadn, mountn (also moutn ×7), iivn (even), evn (heaven); -ing is -in/-n (iivnin, maanin).<\/li><li>Apostrophes only in a few contractions (fi'im, na'av, dwi'it); hyphens in compounds and doubles (nainti-nain, dege-dege, rait-an-said).<\/li><\/ul>\n<h2>The probe's slips<\/h2>\n<p>The write probe (<code>scripts/probe_language.py<\/code>) showed where the model spells by English or by another language: the store's <code>slip:<\/code> entries list the corpus forms (iina, uol, kindom, choch, chrang, diiman, pred, grombl, Iebriyam, Timoti). Some \"never\" forms there come from the model mixing in another language (<em>glajnis<\/em>, <em>schrik<\/em>); they only mean the model was unsure of the word.<\/p>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<ul><li><strong><code>letter:long_vowels<\/code><\/strong> <strong>Long vowels are written double: aa (faada, laad, aal), ii (piipl, iina, biliiv), uu (juu, fuud, nyuu). There is no ee or oo except before hn (neehn, gweehn).<\/strong> [high, observed]<ul><li>NT: LUK 15:12 <em>faada<\/em>; LUK 15:7 <em>piipl<\/em>; LUK 15:2 <em>Farisii<\/em>; ACT 7:11 <em>fuud<\/em><\/li><li>words with aa 13067, ii 15173, uu 3639 tokens. English \"ee/ea\" → ii (siid, priis), \"oo\" → uu (fuud, gruup), \"or/ar/aw\" → aa (laad, staat, laa).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>letter:ie_uo<\/code><\/strong> <strong>The gliding vowels: ie for English \"ay/ai/a_e\" (siem, niem, die, fies), uo for \"o/oa/ow\" (nuo, shuo, uol, kuot).<\/strong> [high, observed]<ul><li>NT: ACT 7:49 <em>Di Laad se<\/em>; LUK 15:3 <em>tuori<\/em>; ACT 5:1 <em>niem<\/em><\/li><li>ie 7021, uo 5993 tokens: siem, ier, wie, die, prie, niem; nuo, uol, shuo, uova, bifuo. Names follow: Iebriyam, Muoziz, Juozif.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>letter:ai_ou<\/code><\/strong> <strong>ai for English \"i_e/y\" (taim, laik, krais), ou for \"ou/ow\" (ous, out, toun, roun).<\/strong> [high, observed]<ul><li>NT: LUK 15:8 <em>lait lamp<\/em>; LUK 15:6 <em>yaad<\/em>; LUK 15:8 <em>di ous<\/em><\/li><li>ai 8449, ou 5304 tokens.<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>letter:short_vowels<\/code><\/strong> <strong>Short vowels: a for English short o and short a (gad, lat, kat, man), o for English short u (lov, blod, son, kom), i for short i, e for short e.<\/strong> [high, observed]<ul><li>NT: LUK 17:32 <em>Lat waif<\/em>; JHN 8:6 <em>fingga<\/em>; 1CO 1:2 <em>Gad<\/em><\/li><li>God = Gad, Lot = Lat, love = lov, blood = blod, come = kom, sun = son (no distinction from son!), church = choch, worship = worship, serve = sorv (English \"ur/er/ir\" = o/or).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>letter:no_h<\/code><\/strong> <strong>English initial h is not written: ous (house), im (him), ier (hear, year, here), api (happy), el (hell), ed (head), ai (high).<\/strong> [high, observed]<ul><li>NT: LUK 15:8 <em>di ous<\/em>; LUK 15:1 <em>fi ier<\/em>; LUK 1:32 <em>Muos Ai Gad<\/em><\/li><li>h appears only in sh, ch, zh (iezha) and in the nasal spelling -hn (waahn, kyaahn, neehn). No c (except ch), q, x or th: th = t or d (ting, di, dat, Set for Seth).<\/li><li>agent:memory-setup, 2026-10-16<\/li><\/ul><\/li><li><strong><code>letter:nasal_hn<\/code><\/strong> <strong>A nasalised vowel is written with hn after it: waahn (want), kyaahn (cannot), neehn (did not), gweehn (going to), iihn (eh?).<\/strong> [high, observed]<u iipl, iina, siid, priis | | long u (food, true) | **uu** | fuud, juu, nyuu, chuu | | ay (face, name) | **ie** | fies, niem, siem, die, prie | | o (go, show) | **uo** | nuo, shuo, uol, uova, bifuo | | i (time) | **ai** | taim, laik, Krais | | ou (house) | **ou** | ous, out, toun, roun | | short o (God, Lot) | **a** | Gad, Lat, rang (wrong), lang (long) | | short u (love, come) | **o** | lov, blod, kom, son (sun and son alike) | | ur/er/ir (church, serve) | **o / or** | choch, sorv, worl, dizorv | | final -er (father) | **a** | faada, mada, breda, afta, neva | | -ear/-air (hear, care) | **ier** | ier, kier, shier, nier | *ee* and *oo* do not occur, except *ee* before the nasal *hn* (neehn, gweehn). ## Consonants - **No h** from English: ous, im, ier (hear/year/here), api, Ai (high). *h* occurs only in sh, ch, zh and in the nasal *-hn*. - **No c, q, x, th**: k, kw, ks; th → t or d (ting, di, dat, Set for Seth). - **Nasal vowels** are written **hn**: waahn (want), kyaahn (cannot), neehn, gweehn. *kyan* = can, *kyaahn* = cannot: the *hn* carries the negation. - **Palatals**: *ky*, *gy* before *a* (kyan, kyari, gyal, gyaadn, Gyalalii), *ny* (nyam, nyuu). Not in every k/g + a: Gad, kaal, gaan have none. - **tr/thr → chr, dr → jr**: chrii (three, tree), chrang, jriim, jringk; *chuu* = through and true. - **Clusters** lose their last consonant: lan, fiil, fren, ges; voiced -s is *z* (kaaz, Muoziz, tingz). - **Syllabic l, n** without a vowel: likl, onggl (only), gyaadn, mountn (also moutn ×7), iivn (even), evn (heaven); -ing is -in/-n (iivnin, maanin). - Apostrophes only in a few contractions (fi'im, na'av, dwi'it); hyphens in compounds and doubles (nainti-nain, dege-dege, rait-an-said). ## The probe's slips The write probe (`scripts/probe_language.py`) showed where the model spells by English or by another language: the store's `slip:` entries list the corpus forms (iina, uol, kindom, choch, chrang, diiman, pred, grombl, Iebriyam, Timoti). Some \"never\" forms there come from the model mixing in another language (*glajnis*, *schrik*); they only mean the model was unsure of the word. ## Store entries <!-- store:begin (generated by scripts/wiki.py sync from profile/; change the store, not this block) --> - **`letter:long_vowels`** **Long vowels are written double: aa (faada, laad, aal), ii (piipl, iina, biliiv), uu (juu, fuud, nyuu). There is no ee or oo except before hn (neehn, gweehn).** [high, observed] - NT: LUK 15:12 *faada*; LUK 15:7 *piipl*; LUK 15:2 *Farisii*; ACT 7:11 *fuud* - words with aa 13067, ii 15173, uu 3639 tokens. English \"ee/ea\" → ii (siid, priis), \"oo\" → uu (fuud, gruup), \"or/ar/aw\" → aa (laad, staat, laa). - agent:memory-setup, 2026-10-16 - **`letter:ie_uo`** **The gliding vowels: ie for English \"ay/ai/a_e\" (siem, niem, die, fies), uo for \"o/oa/ow\" (nuo, shuo, uol, kuot).** [high, observed] - NT: ACT 7:49 *Di Laad se*; LUK 15:3 *tuori*; ACT 5:1 *niem* - ie 7021, uo 5993 tokens: siem, ier, wie, die, prie, niem; nuo, uol, shuo, uova, bifuo. Names follow: Iebriyam, Muoziz, Juozif. - agent:memory-setup, 2026-10-16 - **`letter:ai_ou`** **ai for English \"i_e/y\" (taim, laik, krais), ou for \"ou/ow\" (ous, out, toun, roun).** [high, observed] - NT: LUK 15:8 *lait lamp*; LUK 15:6 *yaad*; LUK 15:8 *di ous* - ai 8449, ou 5304 tokens. - agent:memory-setup, 2026-10-16 - **`letter:short_vowels`** **Short vowels: a for English short o and short a (gad, lat, kat, man), o for English short u (lov, blod, son, kom), i for short i, e for short e.** [high, observed] - NT: LUK 17:32 *Lat waif*; JHN 8:6 *fingga*; 1CO 1:2 *Gad* - God = Gad, Lot = Lat, love = lov, blood = blod, come = kom, sun = son (no distinction from son!), church = choch, worship = worship, serve = sorv (English \"ur/er/ir\" = o/or). - agent:memory-setup, 2026-10-16 - **`letter:no_h`** **English initial h is not written: ous (house), im (him), ier (hear, year, here), api (happy), el (hell), ed (head), ai (high).** [high, observed] - NT: LUK 15:8 *di ous*; LUK >Measures:<\/strong> REV 21:17 converts cubits to feet. Convert the ark's measures (GEN 6:15), or keep cubits with an explanation?<\/li><li><strong>חֶסֶד (loving devotion):<\/strong> <em>kain<\/em> / \"gud an kain tu\" in the NT. Is there a fixed phrase for God's faithful love (Psalms, Genesis 24:27, 32:10)?<\/li><li><strong>Glory:<\/strong> no single word (<em>brait lait<\/em>, <em>priez<\/em>, <em>rispek<\/em>). What should the OT use for God's glory?<\/li><li><strong>Genesis 1 refrains:<\/strong> \"evening and morning, the first day\", \"and it was so\", \"according to its kind\": the corpus has no model. Proposals are on <a href=\"#formulas.md\">formulas<\/a> and <a href=\"#gaps.md\">gaps<\/a>.<\/li><li><strong>Contractions<\/strong> (fi'im, fu'unu, na'av, dwi'it): they appear in some NT books only. Should drafts use them or the full forms?<\/li><li><strong>The book title<\/strong> of Genesis and the chapter word: the corpus has no OT book; project.yaml has <code>chapter_word: Chapter<\/code> from the edition's headings. What should Genesis be called?<\/li><li><strong>\"unu\" vs \"yu\":<\/strong> God addressing Adam and Eve together, or a crowd: the drafts will use <em>unu<\/em> for every plural \"you\". Is that right in solemn speech (blessings, laws)?<\/li><\/ol>\n<h2>Store entries<\/h2>\n<div class=\"store-block\"><div class=\"store-label\">Store entries (generated from profile/)<\/div>\n<p>_(no store entries on this page)_<\/p>\n<\/div>", "text": "# Questions for the language team What the NT corpus could not settle. Answers go into the store as new entries (with `supersedes` where they change one); a quick answer can be written on this page as `> **Correction (name, date):** …`. 1. **How close to the Hebrew?** The Jamaican NT is meaning-based: it explains customs, converts measures and turns abstract nouns into clauses ([style](style.md)). Should the OT follow the same style, or keep closer to the Hebrew wording? 2. **The LORD (YHWH):** the proposal is *di

# Priors: what was believed about the language before its corpus was studied (scripts/priors.py).
# Each item is a hypothesis; `python3 scripts/priors.py check` tests it against the corpus. The team may
# correct or add items (mark them `source: team`); a speaker's entry outranks the model's.
source: 'model knowledge (claude-code, 2026-10-15): hypotheses until the corpus or the team confirms them'
language: Bern German (Berndeutsch)
word_forming_prefixes:
- un-
- ver-
- be-
- er-
- ent-
- zer-
- ab-
- uf-
- us-
- y-
- mit-
- vor-
- aa-
- use-
- ume-
word_forming_suffixes:
- -li
- -ig
- -lech
- -heit
- -keit
- -schaft
- -er
- -i
- -los
- -bar
- -isch
- -ere
- -tum
- -in
- -u
inflection:
- affix: -e
  expect: mood=infinitive
  note: 'infinitive ending: mache, säge, ga/gah and cho are short irregular infinitives'
  confidence: high
- affix: -e
  expect: person+number=fs
  note: '1sg present: i mache; same ending as the plural forms'
  confidence: medium
- affix: -sch
  expect: person+number=ss
  note: '2sg present: du machsch, du hesch, du bisch'
  confidence: high
- affix: -t
  expect: person+number=ts
  note: '3sg present: är macht, si seit'
  confidence: high
- affix: -e
  expect: person+number=fp
  note: '1pl present: mir mache'
  confidence: medium
- affix: -et
  expect: person+number=sp
  note: '2pl present: dir machet; also the polite address form (Ihrzen with Dir)'
  confidence: high
- affix: -e
  expect: person+number=tp
  note: '3pl present: si mache'
  confidence: medium
- affix: -et
  expect: person+number+mood=sp.imperative
  note: 'plural/polite imperative: machet! loset!'
  confidence: medium
- affix: g-
  expect: tense+mood=perfect.participle
  note: 'participle prefix, reduced from ge-: gmacht, gseit, gä, gno; often merges or drops before stops (cho, bracht)'
  confidence: high
- affix: -t
  expect: tense+mood=perfect.participle
  note: 'weak participle ending with g-: gmacht, gläbt'
  confidence: medium
- affix: -e
  expect: tense+mood=perfect.participle
  note: 'strong participle ending with g-: gfunde, gschribe'
  confidence: medium
- affix: -i
  expect: mood=subjunctive
  note: 'subjunctive II on some verbs: i wäri, i hätti, i chönnti; else würd + infinitive'
  confidence: low
- affix: -ig
  expect: mood=subjunctive
  note: 'subjunctive I in reported speech: är syg / sig, är heig'
  confidence: low
- affix: -er
  expect: degree=comparative
  note: grösser, nöcher
  confidence: high
- affix: -schte
  expect: degree=superlative
  note: am gröschte, dr liebschte
  confidence: medium
- affix: -e
  expect: number=plural
  note: a common noun plural ending, but many plurals equal the singular or show only umlaut
  confidence: low
- affix: -ne
  expect: object=3s
  note: 'enclitic masculine object pronoun: i ha ne gseh'
  confidence: medium
- affix: -mer
  expect: person+number=fp
  note: 'enclitic subject pronoun after the verb: hei mer, gö mer'
  confidence: low

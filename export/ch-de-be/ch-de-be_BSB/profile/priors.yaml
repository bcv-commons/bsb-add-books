function_words_source: 'corpus: der 4622 (dr 0), und 7403 (u 4), wil 306 (wüu 0), wi 705 (wie 23), nei for ''but''
  108 verses (sondern 1), nüüt 291 (nüt 10), üüs 269 (üs 6), dihr 1417, dür 297'
notes:
- Verb-second in main clauses and verb-final in subordinate clauses, as in Standard German; verb clusters often
  reverse order (dass er het chönne cho).
- 'There is no simple past: narration uses the perfect (gseit 921×) and, in the Gospels, the historic present (seit
  519×); the pluperfect is ''het … gseit gha'' (49 verses; source: corpus).'
- The future is usually the present tense, sometimes wird + infinitive.
- 'The genitive is almost absent: vo + dative (vo Gott 385×) or a possessive dative; the one exception is Gottes
  (156×) (source: corpus).'
- 'Corpus (source: corpus): no l-vocalisation and no nd → ng: Bietenhard writes Wält, vil, alt, Chind, angere is
  absent; write the conservative forms.'
- 'Spelling is Dieth-like: y = long i (Zyt, sy), ie/ue/üe are diphthongs (lieb, guet, füess), ou/öi correspond to
  Standard au/äu (Frou, Böim), ch- corresponds to initial k (Chind, cho, chönne).'
- 'Corpus (source: corpus): no polite Dir; God and Jesus are addressed with du.'
- Relative clauses use the invariable particle wo (dr Ma, wo das gseit het), with a resumptive pronoun in oblique
  cases.
- 'Pronouns cliticize heavily (hesch es → hesch''s, gö mer, i ha ne); the doubling verbs ga/cho add an extra particle
  before an infinitive (är geit ga bätte, chunnt cho luege). ne (him) and mer (we) are separate words in the corpus,
  not affixes (source: corpus).'
- The diminutive -li (often -eli) is productive and neuter (Chindli, Schäfli); the abstract suffix -ig corresponds
  to Standard -ung (Zytig, Rettig).
- 'Spelling (source: corpus): doubled vowels üü, uu, aa (nüüt, üüs); the participle g- doubles a following b, d,
  g (bbracht, ggä); scht inside words; a linking n before vowel-initial pronouns (won er 255, wo er 1).'
corrected: 'corpus (study test 2, 2026-10-15): items marked `source: corpus` were changed or added from counts in
  Bietenhard''s NT; the model''s spelling leaned to another variety (dr, u, wüu, nüt, üs, Wäut)'
